name: CI

# Install strategy: per-app `npm ci` using each app's own lockfile.
# The root package.json has no workspaces field (root lock is the gateway
# project's); apps/web and apps/blog are independently installable — the same
# way their Vercel projects build them.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: "web - contract, typecheck, build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: "Offline contract gate (CR_MODES consistency + mutation-auth guards)"
        run: python3 scripts/check-contract.py
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npx next build

  blog:
    name: "blog - build (Payload)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/blog
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/blog/package-lock.json
      - name: Install
        run: npm ci
      - name: "Build (no DATABASE_URL needed at build - verified locally)"
        run: npx next build

  hooks:
    name: "pre-push hook syntax"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "bash -n sanity"
        run: bash -n scripts/githooks/pre-push
