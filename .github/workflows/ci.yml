name: CI
# Install strategy: `bun install --frozen-lockfile` using apps/web's own bun.lock
# (the toolchain is Bun 1.4.2 everywhere: local, systemd and CI). The root
# package.json has no workspaces field — apps/web (which now also serves the
# Payload blog, DR-017) is independently installable and its lockfile is
# authoritative. Node 22 stays the RUNTIME (`bun run build` shells out to `node`
# for the scripts); Bun is the installer, task runner and the server runtime.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
defaults:
  run:
    shell: bash
jobs:
  web:
    name: "web - contract, typecheck, build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install
        run: bun install --frozen-lockfile
      - name: "Offline contract gate (CR_MODES consistency + mutation-auth guards)"
        run: python3 scripts/checks/check-contract.py
      - name: "Deploy-unit guard (every ExecStart path must exist)"
        run: python3 scripts/checks/check-deploy.py
      - name: "Structure gate (DR-018 layers)"
        run: python3 scripts/checks/check-structure.py
      - name: Typecheck
        run: bunx tsc --noEmit
      - name: "Shaper fixture tests (offline, recorded upstream payloads)"
        run: bun run test:shapers
      - name: "Reconcile contract vs the Rust service (live Turso + byte-parity diff)"
        env:
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TURSO_AUTH_TOKEN:-}" ]; then
            echo "::warning title=reconcile harness skipped::TURSO_AUTH_TOKEN secret is not set; the live gate for /api/reconcile (Rust service + byte-parity diff) did NOT run"
            exit 0
          fi
          # Build the Rust service this route proxies to, from this same commit.
          cargo build --release --manifest-path ../../services/sync/Cargo.toml
          ../../services/sync/target/release/fudcourt-reconciled &
          SVC=$!
          trap 'kill $SVC 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            curl -sf --max-time 2 http://127.0.0.1:3102/healthz >/dev/null && break
            sleep 1
          done
          python3 scripts/verify/verify-reconcile.py --base http://127.0.0.1:3102
      - name: Build
        run: bun run build
  apicalls:
    name: "apicalls - build, vet, test (Go sidecar)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/data
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
          cache-dependency-path: services/data/go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  sync:
    name: "sync - build, test (Rust services: fudcourt-sync + fudcourt-reconciled)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/sync
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build (both binaries)
        run: cargo build --release --bins
      - name: Test
        run: cargo test --release
  api:
    name: "api+executor - build, vet, test (Go backend modules)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: |
            services/api/go.sum
            services/executor/go.sum
      - name: Build
        run: go build ./services/api/... ./services/executor/...
      - name: Vet
        run: go vet ./services/api/... ./services/executor/...
      - name: Test
        run: go test ./services/api/... ./services/executor/...
  contracts:
    name: "contracts - drift gate + generated SDK typecheck"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: "Contracts drift gate (OpenAPI enums vs types.ts, route coverage, event catalog)"
        run: node packages/contracts/scripts/check-contract.mjs
      - name: "Generated SDK matches its sources (openapi + event catalog)"
        working-directory: packages/sdk-ts
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          # Regenerate and compare against the tree copy — catches stale or
          # hand-edited src/generated regardless of git state (generate is
          # deterministic: same inputs -> byte-identical output).
          tmp=$(mktemp -d)
          cp -r src/generated "$tmp/generated"
          bun run generate
          if ! diff -r "$tmp/generated" src/generated; then
            echo "::error::src/generated is stale vs packages/contracts — run 'cd packages/sdk-ts && bun run generate' and commit"
            exit 1
          fi
      - name: "SDK typecheck (strict)"
        working-directory: packages/sdk-ts
        run: bun run typecheck
  hooks:
    name: "pre-push hook syntax"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: "bash -n sanity"
        run: bash -n scripts/githooks/pre-push
