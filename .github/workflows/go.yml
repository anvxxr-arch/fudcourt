name: go
# Surface: ONE Go module at the repository root (github.com/anvxxr-arch/fudcourt).
# The four modules this workflow used to build separately (backend/{api,bot,data},
# backend/workers/executor) were consolidated in Phase 2: the new module path is a
# strict prefix of all four old ones, so no import path needed rewriting, and the
# dependency union is exactly the previous union.
#
# A single `go build/vet/test ./...` from the root therefore covers every
# package, and a failure names its package in the output — which is the same
# information the old per-module matrix carried, without four toolchain setups.
#
# This workflow always RUNS; the build job is skipped by the `changes` gate when
# nothing Go moved, so a CSS-only PR compiles no Go. See web.yml for why the
# filter is a job and not a workflow-level `paths:`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: "go - did Go move"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/go.yml'
  build:
    name: "go - build, vet, test"
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          # The module's own floor: bogdanfinn/tls-client + fhttp require >= 1.24.1,
          # and the toolchain directive in go.mod pins the rest.
          go-version: '1.25.0'
          cache-dependency-path: |
            go.mod
            go.sum
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
  gate:
    name: "go - gate (required)"
    needs: [build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Verdict"
        run: |
          echo "build result: ${{ needs.build.result }}"
          case "${{ needs.build.result }}" in
            success|skipped) exit 0 ;;
            *) echo "::error::go surface failed"; exit 1 ;;
          esac
