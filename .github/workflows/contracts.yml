name: contracts
# Surface: the API/event source of truth — contracts (OpenAPI + event
# catalog). A contracts change is
# cross-cutting: it can invalidate the Go services and the web client, which is
# exactly why it also triggers web.yml and go.yml (see the hints in that
# workflow's filter) rather than being checked in isolation here.
#
# This workflow always RUNS; the check job is skipped when nothing under
# shared/ moved. See web.yml for why the filter is a job, not a `paths:`.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
defaults:
  run:
    shell: bash
jobs:
  changes:
    name: "contracts - which surface changed"
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'shared/**'
              - '.github/workflows/contracts.yml'
  check:
    name: "contracts - drift gate + generated SDK"
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: "Contracts drift gate (OpenAPI refs/enums vs types.ts, route coverage, event catalog)"
        run: node contracts/scripts/check-contract.mjs
  gate:
    name: "contracts - gate (required)"
    needs: [check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: "Verdict"
        run: |
          echo "check result: ${{ needs.check.result }}"
          case "${{ needs.check.result }}" in
            success|skipped) exit 0 ;;
            *) echo "::error::contracts surface failed"; exit 1 ;;
          esac
