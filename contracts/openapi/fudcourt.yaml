    # ------------------------------------------------------------------
    # llama (DeFiLlama TVL; derived/sorted views labelled, no HTML crosses this boundary)
    # ------------------------------------------------------------------
    LlamaEnvelope:
      type: object
      additionalProperties: true
      required: [kind, rows, upstream, fetchedAt, upstreamTotal, derived]
      description: "`{kind, rows, upstream, fetchedAt, upstreamTotal, derived}`; `cache` is header-only (`X-Cache`), never in the body. Row shapes: chains = `{name, tvl, tokenSymbol?, gecko_id?, chainId?}`; protocols = `{name, slug, category, tvl, change_1d, change_7d, mcap, chains, url, logo}` (nullable-any passthrough); historical = `{date, tvl}`."
      properties:
        kind:
          type: string
          enum: [chains, protocols, historical]
        rows:
          type: array
          description: The upstream rows, resorted per mode; upstream-defined shape.
          items:
            type: object
            additionalProperties: true
        upstream: { type: string }
        fetchedAt:
          type: integer
          format: int64
          description: Unix seconds.
        upstreamTotal: { type: integer }
        derived: { type: string }
    # ------------------------------------------------------------------
    # news (Cointelegraph RSS)
    # ------------------------------------------------------------------
    NewsEnvelope:
      type: object
      additionalProperties: false
      required: [items, total, upstream, timestamp]
      description: "`items` is the `limit` head; `total` is the FULL parsed count (the two differ by design). `timestamp` is unix ms."
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
        total: { type: integer }
        upstream: { type: string }
        timestamp:
          type: integer
          format: int64
          description: Unix milliseconds.
    NewsItem:
      type: object
      additionalProperties: false
      required: [title, link, description, pubDate, image, source]
      description: Six strings, always present (empty string when the RSS item lacks the field — the parser's own normalization).
      properties:
        title: { type: string }
        link: { type: string }
        description: { type: string }
        pubDate: { type: string }
        image: { type: string }
        source: { type: string }
    # ------------------------------------------------------------------
    # Reconciliation (Rust service, forwarded verbatim)
    # ------------------------------------------------------------------
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [rows, wallets, walletSummary, source]
      description: "`rows` sorted by biggest |diff| first. `walletSummary` is keyed by wallet name and built in row insertion order (sorted-rows order). `current_total` counts only the stablecoin legs (USDC/USDT) while `expected_total`/`diff_total` count every leg — the route's own quirk, kept."
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReconRow'
        wallets:
          type: array
          description: 'Wallet rows (`SELECT address, label, alias, emoji, color, chain FROM wallets ORDER BY label`), passed through as objects.'
          items:
            $ref: '#/components/schemas/ReconcileWalletRow'
        walletSummary:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WalletSummaryTotals'
        source:
          type: string
          description: 'Names the implementation that produced the numbers (e.g. `rust`), so a reader can tell the Rust service''s answer from the TS oracle''s during the parallel run.'
    ReconRow:
      type: object
      additionalProperties: false
      required: [wallet, asset, current, in_sum, out_sum, expected, diff]
      properties:
        wallet: { type: string }
        asset: { type: string }
        current: { type: number }
        in_sum: { type: number }
        out_sum: { type: number }
        expected: { type: number }
        diff:
          type: number
          description: 'current − expected (per asset).'
    ReconcileWalletRow:
      type: object
      additionalProperties: true
      required: [address, chain]
      description: 'A wallets-table row passed through raw from Postgres. Every SELECTED column key is always present (the Rust reader inserts each column with `Value::Null` when a cell is absent), but every VALUE is nullable — including `address`/`chain` — so presence is guaranteed and non-null is not.'
      properties:
        address: { type: string, nullable: true }
        label: { type: string, nullable: true }
        alias: { type: string, nullable: true }
        emoji: { type: string, nullable: true }
        color: { type: string, nullable: true }
        chain: { type: string, nullable: true }
    WalletSummaryTotals:
      type: object
      additionalProperties: false
      required: [current_total, expected_total, diff_total]
      properties:
        current_total: { type: number }
        expected_total: { type: number }
        diff_total: { type: number }
    # ==================================================================
    # Treasury read model (Postgres read-side, DR-019) — the row shapes the
    # `/api/{all,coins,wallets,transactions}` handlers return verbatim.
    # Columns mirror `database/schema/pg-schema.sql` exactly; rows are
    # UNVALIDATED at the
    # boundary, so a nullable column is `nullable: true` here, never omitted
    # and never coerced to 0.
    # ==================================================================
    AccountRow:
      type: object
      additionalProperties: true
      required: [code, name, type, statement]
      description: One `accounts` row.
      properties:
        code: { type: string }
        name: { type: string }
        type: { type: string }
        statement: { type: string }
    AssetRow:
      type: object
      additionalProperties: true
      required: [id, chain, asset]
      description: One `assets` row (latest-state balances; the time series is `asset_history`).
      properties:
        id: { type: integer }
        chain: { type: string }
        asset: { type: string }
        quantity: { type: number, nullable: true }
        value_usd: { type: number, nullable: true }
        share_pct: { type: number, nullable: true }
        wallet: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
    JournalRow:
      type: object
      additionalProperties: true
      required: [id, date, entry_code]
      description: One `journal` row.
      properties:
        id: { type: integer }
        date: { type: string }
        entry_code: { type: string }
        debit_account: { type: string, nullable: true }
        credit_account: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        amount: { type: number, nullable: true }
        status: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
    LedgerRow:
      type: object
      additionalProperties: true
      required: [id, account_code, account_name, side]
      description: One `ledger` row.
      properties:
        id: { type: integer }
        account_code: { type: string }
        account_name: { type: string }
        side: { type: string }
        balance: { type: number }
        currency: { type: string, nullable: true }
    TradeRow:
      type: object
      additionalProperties: true
      required: [id, date]
      description: One `trades` row.
      properties:
        id: { type: integer }
        date: { type: string }
        venue: { type: string, nullable: true }
        symbol: { type: string, nullable: true }
        side: { type: string, nullable: true }
        quantity: { type: number, nullable: true }
        price: { type: number, nullable: true }
        pnl: { type: number, nullable: true }
        status: { type: string, nullable: true }
    TransactionRow:
      type: object
      additionalProperties: true
      required: [id, date, chain, event]
      description: |
        One `transactions` row (`SELECT *`, column order of
        `database/schema/pg-schema.sql`). `asset`/`amount_usd`/`direction`/
        `hash`/`url`/`source`/`memo`/`wallet_to`/`venue_id`/`trade_id` are
        nullable; the write paths keep writing SQL NULL (never `0`/`''`).
      properties:
        id: { type: integer }
        date: { type: string }
        chain: { type: string }
        asset: { type: string, nullable: true }
        event: { type: string }
        amount_usd: { type: number, nullable: true }
        direction: { type: string, nullable: true }
        hash: { type: string, nullable: true }
        url: { type: string, nullable: true }
        source: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        memo: { type: string, nullable: true }
        wallet_to: { type: string, nullable: true }
        venue_id: { type: string, nullable: true }
        trade_id: { type: string, nullable: true }
    WalletRow:
      type: object
      additionalProperties: true
      required: [address]
      description: |
        One `wallets` row, `SELECT *`. `monitored` is the SQLite-derived
        integer 0/1 (Postgres `integer`), passed through as a NUMBER — the
        board reads it as a flag, not a boolean. `emoji`/`color` carry the
        schema defaults for a fresh row but are nullable for legacy rows.
      properties:
        address: { type: string }
        label: { type: string, nullable: true }
        chain: { type: string, nullable: true }
        monitored: { type: integer, nullable: true }
        created_at: { type: string, nullable: true }
        alias: { type: string, nullable: true }
        emoji: { type: string, nullable: true }
        color: { type: string, nullable: true }
        notes: { type: string, nullable: true }
    CoinRow:
      type: object
      additionalProperties: true
      required: [asset]
      description: |
        One `GROUP BY asset` aggregate row. The aggregates are NOT coerced:
        the driver's numeric representation is passed through, so a consumer
        must accept number or string (the route's own doc calls them
        "string-typed aggregates"). `chains`/`wallets` are `COUNT(DISTINCT …)`.
      properties:
        asset: { type: string }
        total_usd: { type: number, nullable: true }
        total_qty: { type: number, nullable: true }
        chains: { type: integer, nullable: true }
        wallets: { type: integer, nullable: true }
    AllResponse:
      type: object
      additionalProperties: false
      required: [accounts, transactions, journal, ledger, assets, wallets, trades, net_worth, period, liabilities, pnl, cashflow]
      description: |
        `getAll()`'s object literal, key order as written: the seven
        `DASHBOARD_READS` row arrays, then the board constants. The constants
        are FROZEN board values, not computed: `period` is the literal
        `9 Sep 2026 – sekarang` and `liabilities: 0`, `pnl: 0`,
        `cashflow: -850` are hardcoded — a consumer must not read them as
        derived truth. `net_worth` is `SUM(value_usd)` and falls back to the
        literal `0` only when the aggregate is not a number (empty table).
        `transactions` is the FULL table (no LIMIT); `trades` is capped at 20.
      properties:
        accounts:
          type: array
          items: { $ref: '#/components/schemas/AccountRow' }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/TransactionRow' }
        journal:
          type: array
          items: { $ref: '#/components/schemas/JournalRow' }
        ledger:
          type: array
          items: { $ref: '#/components/schemas/LedgerRow' }
        assets:
          type: array
          items: { $ref: '#/components/schemas/AssetRow' }
        wallets:
          type: array
          items: { $ref: '#/components/schemas/WalletRow' }
        trades:
          type: array
          items: { $ref: '#/components/schemas/TradeRow' }
        net_worth: { type: number }
        period: { type: string }
        liabilities: { type: number }
        pnl: { type: number }
        cashflow: { type: number }
    CoinsResponse:
      type: object
      additionalProperties: false
      required: [coins, total]
      properties:
        coins:
          type: array
          items: { $ref: '#/components/schemas/CoinRow' }
        total:
          type: number
          description: 'JS `reduce` over `Number(total_usd || 0)` — a real number, `0` for an empty table.'
    TransactionListResponse:
      type: object
      additionalProperties: false
      required: [transactions, total, limit, offset, search, chain, venue, direction, fromDate, toDate]
      description: |
        Rows plus the RAW filter echoes (`''` when the param was absent;
        `limit`/`offset` are the parsed integers with their `parseInt`
        fallbacks). `total` is the same-filter `COUNT(*)` — the count of the
        full filtered set, not of the returned page.
      properties:
        transactions:
          type: array
          items: { $ref: '#/components/schemas/TransactionRow' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        search: { type: string }
        chain: { type: string }
        venue: { type: string }
        direction: { type: string }
        fromDate: { type: string }
        toDate: { type: string }
    WalletUpdateInput:
      type: object
      additionalProperties: false
      required: [address]
      description: |
        Body of `POST /api/wallets`. `address` is the ROW KEY (this POST is an
        UPDATE, never an insert). At least one of the four display fields must
        be present or the route answers 400 `nothing to update`; an absent
        field is left untouched (`!== undefined` guard).
      properties:
        address: { type: string }
        alias: { type: string }
        emoji: { type: string }
        color: { type: string }
        notes: { type: string }
    TransactionWritableFields:
      type: object
      additionalProperties: false
      description: |
        The writable `transactions` columns, shared by the create and patch
        bodies. `amount_usd` goes through `parseFloat(...) || 0` in the write
        path (a non-numeric value becomes `0`, it does not refuse). SQL NULL is
        written for an omitted nullable field (`x || null`), never `''`.
      properties:
        date: { type: string }
        chain: { type: string }
        asset: { type: string }
        event: { type: string }
        amount_usd: { type: number }
        direction: { type: string }
        memo: { type: string }
        wallet_to: { type: string }
        venue_id: { type: string }
        trade_id: { type: string }
        hash: { type: string }
        url: { type: string }
        source: { type: string }
    TransactionRowInput:
      allOf:
        - $ref: '#/components/schemas/TransactionWritableFields'
      description: 'One bulk row. A per-row `date` defaults to today when omitted.'
    TransactionCreateInput:
      allOf:
        - $ref: '#/components/schemas/TransactionWritableFields'
      description: |
        Single-row create. `date` AND `event` are required (400
        `date and event required`); `chain` defaults to `Offchain`, `asset` to
        `USDT`, `source` to `manual`, and an omitted `direction` is derived
        from the sign (`amt >= 0 ? 'IN' : 'OUT'`).
    TransactionBulkInput:
      type: object
      additionalProperties: false
      required: [bulk, transactions]
      description: 'Bulk create. Reached only when `bulk` is truthy; the rows are NOT validated (no `event` requirement on this path).'
      properties:
        bulk:
          type: boolean
          enum: [true]
        transactions:
          type: array
          items: { $ref: '#/components/schemas/TransactionRowInput' }
    TransactionBulkInsertResponse:
      type: object
      additionalProperties: false
      required: [inserted, transactions]
      description: 'One row read back per insert (`ORDER BY id DESC LIMIT 1`); `inserted` is the number of RESULTS, not a transaction count — the batch is not transactional and concurrent writers can interleave.'
      properties:
        inserted: { type: integer }
        transactions:
          type: array
          items: { $ref: '#/components/schemas/TransactionRow' }
    TransactionBulkUpdateInput:
      type: object
      additionalProperties: false
      required: [ids, updates]
      description: 'Body of `PUT /api/transactions`. Only listed update fields are written; an empty update set is 400 `nothing to update`.'
      properties:
        ids:
          type: array
          items: { type: integer }
        updates: { $ref: '#/components/schemas/TransactionWritableFields' }
    TransactionPatchInput:
      type: object
      additionalProperties: false
      description: 'Body of `PUT`/`PATCH /api/transactions/{id}` — the same field set; an empty set is 400 `nothing to update`, an absent row answers `{}` with 200.'
      properties:
        date: { type: string }
        chain: { type: string }
        asset: { type: string }
        event: { type: string }
        amount_usd: { type: number }
        direction: { type: string }
        memo: { type: string }
        wallet_to: { type: string }
        venue_id: { type: string }
        trade_id: { type: string }
        hash: { type: string }
        url: { type: string }
        source: { type: string }
    TransactionBulkDeleteInput:
      type: object
      additionalProperties: false
      required: [ids]
      description: 'Body of `DELETE /api/transactions` and `{id}`-less bulk delete. A missing/empty `ids` array is 400 `ids array required`.'
      properties:
        ids:
          type: array
          items: { type: integer }
    BulkUpdateResponse:
      type: object
      additionalProperties: false
      required: [updated, count]
      properties:
        updated: { type: boolean, enum: [true] }
        count:
          type: integer
          description: 'The number of ids REQUESTED, not the number of rows actually changed.'
    BulkDeleteResponse:
      type: object
      additionalProperties: false
      required: [deleted, count]
      properties:
        deleted: { type: boolean, enum: [true] }
        count:
          type: integer
          description: 'The number of ids REQUESTED, not the number of rows actually deleted.'
    TransactionDeleteResponse:
      type: object
      additionalProperties: false
      required: [deleted, id, row]
      properties:
        deleted: { type: boolean, enum: [true] }
        id: { type: integer }
        row: { $ref: '#/components/schemas/TransactionRow' }
    # ==================================================================
    # Admin control plane (proxied to backend/api, which owns the logic)
    # ==================================================================
    MemberRow:
      type: object
      additionalProperties: false
      required: [id, username, globalName, avatar, tier]
      description: 'One guild member. `globalName`/`avatar` are written as `null` when Discord has no value — the keys are always PRESENT (the honest-null rule), unlike `RoleIds`.'
      properties:
        id: { type: string }
        username: { type: string }
        globalName: { type: string, nullable: true }
        avatar: { type: string, nullable: true }
        tier: { $ref: '#/components/schemas/Tier' }
    Tier:
      type: string
      description: Resolved from the member's Discord roles.
      enum: [public, member, team, admin]
    RoleIds:
      type: object
      additionalProperties: false
      description: |
        The configured role id table. `omitempty` on the Go wire: an unset
        `FUDCOURT_ROLE_TEAM`/`FUDCOURT_ROLE_ADMIN` makes the KEY ABSENT, not
        `null` — a deliberate divergence from the honest-null rule so the
        legacy TS consumer keeps parsing the same shape.
      properties:
        team: { type: string }
        admin: { type: string }
    AdminMembersResponse:
      type: object
      additionalProperties: false
      required: [members, roleIds]
      description: 'Key order: `members`, then `roleIds`.'
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/MemberRow' }
        roleIds: { $ref: '#/components/schemas/RoleIds' }
    RoleChangeInput:
      type: object
      additionalProperties: false
      required: [userId, role, action]
      properties:
        userId: { type: string }
        role:
          type: string
          enum: [team, admin]
        action:
          type: string
          enum: [add, remove]
    RoleChangeResponse:
      type: object
      additionalProperties: false
      required: [ok, userId, role, action]
      properties:
        ok: { type: boolean, enum: [true] }
        userId: { type: string }
        role: { type: string }
        action: { type: string }
    # ==================================================================
    # Market data (CoinGecko markets / cross-venue ticker / DexScreener)
    # ==================================================================
    MarketsCoin:
      type: object
      additionalProperties: false
      required: [symbol, baseAsset, quoteAsset, lastPrice, priceChangePercent, highPrice, lowPrice, volume, quoteVolume, marketCap, rank, count]
      description: |
        One mapped CoinGecko row. Nullable upstream metrics stay `null`
        (never 0-filled); `quoteAsset` is the literal `USD`. `name`/`image`
        are present only when upstream sent them.
      properties:
        symbol: { type: string }
        baseAsset: { type: string }
        quoteAsset: { type: string, enum: [USD] }
        name: { type: string }
        image: { type: string }
        lastPrice: { type: number }
        priceChangePercent: { type: number, nullable: true }
        highPrice: { type: number, nullable: true }
        lowPrice: { type: number, nullable: true }
        volume: { type: number, nullable: true }
        quoteVolume: { type: number, nullable: true }
        marketCap: { type: number }
        rank: { type: number }
        count: { type: number }
    MarketsResponse:
      type: object
      additionalProperties: false
      required: [coins, total, limit, offset, hasMore, timestamp, pool, upstreamTotal, upstream, derived]
      description: |
        The tracker envelope. `pool`/`upstreamTotal` are the SAME number (the
        CoinGecko top-250 pool); `total` is the locally-matched count;
        `derived` states the local search/sort/pagination rather than
        pretending CoinGecko did it. `timestamp` is unix SECONDS.
      properties:
        coins:
          type: array
          items: { $ref: '#/components/schemas/MarketsCoin' }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        hasMore: { type: boolean }
        timestamp: { type: integer, format: int64 }
        pool: { type: integer }
        upstreamTotal: { type: integer }
        upstream: { type: string }
        derived: { type: string }
    ForexPair:
      type: object
      additionalProperties: false
      required: [pair, base, quote, rate, inverse]
      description: 'One curated forex pair, DERIVED locally from the USD base rates (`rate` is the displayed quote; `inverse` its reciprocal).'
      properties:
        pair: { type: string }
        base: { type: string }
        quote: { type: string }
        rate: { type: number }
        inverse: { type: number }
    ForexResponse:
      type: object
      additionalProperties: false
      required: [pairs, count, base, updated, upstream, derived]
      description: 'The forex board body: curated pairs plus provenance. `updated` is unix seconds or null (a daily feed).'
      properties:
        pairs:
          type: array
          items: { $ref: '#/components/schemas/ForexPair' }
        count: { type: integer }
        base: { type: string }
        updated: { type: integer, nullable: true }
        upstream: { type: string }
        derived: { type: string }
    MarketQuote:
      type: object
      additionalProperties: false
      required: [symbol, name, price]
      description: |
        One Yahoo-chart quote row (stock and commodity share it). Every metric
        the payload omits is null — the UI renders `—`, never 0. Upstream
        `regularMarketVolume: 0` means "not published" and the UI also renders
        `—`; the raw value is kept here exactly as upstream sent it.
      properties:
        symbol: { type: string }
        name: { type: string }
        kind: { type: string, nullable: true }
        exchange: { type: string, nullable: true }
        currency: { type: string, nullable: true }
        price: { type: number }
        previousClose: { type: number, nullable: true }
        change: { type: number, nullable: true }
        changePercent: { type: number, nullable: true }
        dayHigh: { type: number, nullable: true }
        dayLow: { type: number, nullable: true }
        volume: { type: number, nullable: true }
        week52High: { type: number, nullable: true }
        week52Low: { type: number, nullable: true }
        marketTime: { type: number, nullable: true }
    QuoteFailure:
      type: object
      additionalProperties: false
      required: [symbol, reason]
      description: 'One symbol that did not resolve, with the reason (never silently dropped).'
      properties:
        symbol: { type: string }
        reason: { type: string }
    MarketQuoteResponse:
      type: object
      additionalProperties: false
      required: [quotes, count, failed, upstream, asOf, derived]
      description: 'The stock/commodity board body: quote rows, the failure ledger, and provenance. `asOf` is unix seconds; the stock board additionally echoes `region`.'
      properties:
        region: { type: string }
        quotes:
          type: array
          items: { $ref: '#/components/schemas/MarketQuote' }
        count: { type: integer }
        failed:
          type: array
          items: { $ref: '#/components/schemas/QuoteFailure' }
        upstream: { type: string }
        asOf: { type: integer }
        derived: { type: string }
    TickerExchange:
      type: string
      description: The ten venues the board reads; measured reachability, not ccxt's static claim.
      enum: [okx, bybit, bitget, mexc, phemex, bingx, bitfinex, htx, coinbase, kraken]
    TickerType:
      type: string
      enum: [spot, swap, future, option]
    TickerInstrument:
      type: object
      additionalProperties: false
      required: [settle, symbol, type]
      description: 'The venue''s own instrument description, carried so a row is unambiguous about WHICH instrument it priced (`expiry` ms, `strike`, `optionKind`).'
      properties:
        settle: { type: string, nullable: true }
        symbol: { type: string }
        type: { $ref: '#/components/schemas/TickerType' }
        expiry: { type: integer, nullable: true }
        strike: { type: number, nullable: true }
        optionKind:
          type: string
          nullable: true
          enum: [call, put]
        contractSize: { type: number, nullable: true }
    VenueQuote:
      type: object
      additionalProperties: false
      required: [exchange, last, at]
      description: 'One venue''s own quote. `at` is the venue timestamp (ms), or `Date.now()` when the venue reported none — `last` is the only always-real number.'
      properties:
        exchange: { $ref: '#/components/schemas/TickerExchange' }
        last: { type: number }
        bid: { type: number, nullable: true }
        ask: { type: number, nullable: true }
        high24h: { type: number, nullable: true }
        low24h: { type: number, nullable: true }
        baseVolume: { type: number, nullable: true }
        quoteVolume: { type: number, nullable: true }
        change24h: { type: number, nullable: true }
        at: { type: integer, format: int64 }
        openInterest: { type: number, nullable: true }
        fundingRate: { type: number, nullable: true }
    TickerRow:
      type: object
      additionalProperties: false
      required: [symbol, base, quote, type, instrument, price, change24h, high24h, low24h, quoteVolume, venues, spread, failed]
      description: |
        Rows are keyed by `(symbol, type, settlement)` — the same coin in two
        market types or two settlements is TWO rows, never folded.
        `change24h` is in PERCENT (ccxt's own `percentage`, e.g. `-1.36` =
        −1.36%) — the UI appends the `%`; it is NOT a fraction, so do not
        multiply by 100. `spread` is the max divergence in PERCENT vs the
        median, `null` when fewer than two venues quoted.
      properties:
        symbol: { type: string }
        base: { type: string }
        quote: { type: string }
        type: { $ref: '#/components/schemas/TickerType' }
        instrument: { $ref: '#/components/schemas/TickerInstrument' }
        price: { type: number, nullable: true }
        change24h: { type: number, nullable: true }
        high24h: { type: number, nullable: true }
        low24h: { type: number, nullable: true }
        quoteVolume: { type: number, nullable: true }
        venues:
          type: array
          items: { $ref: '#/components/schemas/VenueQuote' }
        spread: { type: number, nullable: true }
        failed:
          type: array
          items: { $ref: '#/components/schemas/TickerExchange' }
    TickerDerived:
      type: object
      additionalProperties: false
      required: [search, sort, order, type, filteredLocally]
      properties:
        search: { type: string }
        sort: { type: string }
        order: { type: string }
        type: { type: string }
        filteredLocally:
          type: boolean
          enum: [true]
    TickerResponse:
      type: object
      additionalProperties: false
      required: [rows, count, total, limit, offset, page, hasMore, exchanges, types, typeLabels, venuesForType, typeCounts, universe, universeNote, scopeNote, derived, timestamp]
      description: |
        The board envelope. `universe` is the fixed 30-pair allowlist and
        `universeNote` says so explicitly (there is no keyless market-cap
        ranking upstream); `scopeNote` separates CEX instruments from the DEX
        family. `timestamp` is unix MILLISECONDS. `Cache-Control:
        public, max-age=60`.
      properties:
        rows:
          type: array
          items: { $ref: '#/components/schemas/TickerRow' }
        count: { type: integer }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
        page: { type: integer }
        hasMore: { type: boolean }
        exchanges:
          type: array
          items: { $ref: '#/components/schemas/TickerExchange' }
        types:
          type: array
          items: { $ref: '#/components/schemas/TickerType' }
        typeLabels:
          type: object
          additionalProperties: { type: string }
        venuesForType:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/TickerExchange' }
        typeCounts:
          type: object
          additionalProperties: { type: integer }
        universe:
          type: array
          items: { type: string }
        universeNote: { type: string }
        scopeNote: { type: string }
        derived: { $ref: '#/components/schemas/TickerDerived' }
        timestamp: { type: integer, format: int64 }
    TypeInstrumentSummary:
      type: object
      additionalProperties: false
      required: [venues, expiries, strikesByExpiry, default]
      description: |
        One market type's offering for a coin. `strikesByExpiry` is PER expiry
        because strikes genuinely differ by date; `expiries` are ISO
        `YYYY-MM-DD`. `default` is computed with the same helper the board
        uses (and a real spot price), so the preselected instrument here and
        the one a board row lands on cannot disagree; `null` when nothing is
        listed.
      properties:
        venues:
          type: array
          items: { $ref: '#/components/schemas/TickerExchange' }
        expiries:
          type: array
          items: { type: string }
        strikesByExpiry:
          type: object
          additionalProperties:
            type: array
            items: { type: number }
        default:
          type: object
          nullable: true
          additionalProperties: false
          required: [symbol, expiry, strike, optionKind]
          properties:
            symbol: { type: string }
            expiry: { type: string, nullable: true }
            strike: { type: number, nullable: true }
            optionKind:
              type: string
              nullable: true
              enum: [call, put]
    VenueInstrumentCount:
      type: object
      additionalProperties: false
      required: [types, instruments]
      properties:
        types:
          type: array
          items: { $ref: '#/components/schemas/TickerType' }
        instruments: { type: integer }
    InstrumentsResponse:
      type: object
      additionalProperties: false
      required: [symbol, base, quote, types, venues, typeLabels, venuesForType, timestamp]
      description: |
        `types` ALWAYS carries all four keys (spot/swap/future/option),
        initialised to empty summaries — a missing type is an empty summary,
        never an absent key. `venues` holds only venues that listed something.
        `timestamp` is unix MILLISECONDS. `null` exchange symbol is 404
        `unknown_symbol`.
      properties:
        symbol: { type: string }
        base: { type: string }
        quote: { type: string }
        types:
          type: object
          additionalProperties: { $ref: '#/components/schemas/TypeInstrumentSummary' }
        venues:
          type: object
          additionalProperties: { $ref: '#/components/schemas/VenueInstrumentCount' }
        typeLabels:
          type: object
          additionalProperties: { type: string }
        venuesForType:
          type: object
          additionalProperties:
            type: array
            items: { $ref: '#/components/schemas/TickerExchange' }
        timestamp: { type: integer, format: int64 }
    InstrumentQuote:
      type: object
      additionalProperties: false
      required: [exchange, symbol, error]
      description: |
        One venue's quote for the resolved instrument; unquoted fields stay
        `null`. `error` names WHY a venue did not price (e.g. `no price
        returned`) and is `null` on a real quote — a venue that errored is
        reported, never silently dropped.
      properties:
        exchange: { $ref: '#/components/schemas/TickerExchange' }
        symbol: { type: string }
        error: { type: string, nullable: true }
        settle: { type: string, nullable: true }
        last: { type: number, nullable: true }
        bid: { type: number, nullable: true }
        ask: { type: number, nullable: true }
        high24h: { type: number, nullable: true }
        low24h: { type: number, nullable: true }
        baseVolume: { type: number, nullable: true }
        quoteVolume: { type: number, nullable: true }
        change24h: { type: number, nullable: true }
        openInterest: { type: number, nullable: true }
        fundingRate: { type: number, nullable: true }
        at: { type: integer, nullable: true }
    InstrumentRequest:
      type: object
      additionalProperties: false
      required: [expiry, strike, kind]
      description: The NORMALIZED selection echoed back.
      properties:
        expiry: { type: string, nullable: true }
        strike: { type: number, nullable: true }
        kind:
          type: string
          nullable: true
          enum: [call, put]
    InstrumentResponse:
      type: object
      additionalProperties: false
      required: [base, type, typeLabel, request, instruments, settlements, quotes, priced, price, notListed, failed, timestamp]
      description: |
        `notListed` (the venue has no such instrument) and `failed` (it should
        have answered and did not) are kept APART because they call for
        different reactions. `price` is the median across venues that priced
        it — `null` when none did. `timestamp` is unix MILLISECONDS.
      properties:
        base: { type: string }
        type: { $ref: '#/components/schemas/TickerType' }
        typeLabel: { type: string }
        request: { $ref: '#/components/schemas/InstrumentRequest' }
        instruments:
          type: array
          items: { $ref: '#/components/schemas/TickerInstrument' }
        settlements:
          type: array
          items: { type: string }
        quotes:
          type: array
          items: { $ref: '#/components/schemas/InstrumentQuote' }
        priced: { type: integer }
        price: { type: number, nullable: true }
        notListed:
          type: array
          items: { $ref: '#/components/schemas/TickerExchange' }
        failed:
          type: array
          items: { $ref: '#/components/schemas/TickerExchange' }
        timestamp: { type: integer, format: int64 }
    DexProfile:
      type: object
      additionalProperties: false
      required: [address, chain, links]
      description: 'One profile/boost record. Nullable display fields stay `null`; `links` is always an array (possibly empty).'
      properties:
        address: { type: string }
        chain: { type: string }
        symbol: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        header: { type: string, nullable: true }
        description: { type: string, nullable: true }
        links:
          type: array
          items:
            type: object
            additionalProperties: true
            properties:
              label: { type: string }
              url: { type: string }
              type: { type: string }
        amount: { type: number, nullable: true }
        totalAmount: { type: number, nullable: true }
        url: { type: string, nullable: true }
    DexPair:
      type: object
      additionalProperties: true
      required: [chainId, dexId, url, pairAddress, baseToken, quoteToken]
      description: 'A RAW upstream DexScreener pair, passed through unreshaped — optional metrics are genuinely optional, and the route never invents one.'
      properties:
        chainId: { type: string }
        dexId: { type: string }
        url: { type: string }
        pairAddress: { type: string }
        labels:
          type: array
          items: { type: string }
        baseToken:
          type: object
          additionalProperties: true
          required: [address, name, symbol]
          properties:
            address: { type: string }
            name: { type: string }
            symbol: { type: string }
        quoteToken:
          type: object
          additionalProperties: true
          required: [address, name, symbol]
          properties:
            address: { type: string }
            name: { type: string }
            symbol: { type: string }
        priceNative: { type: string }
        priceUsd: { type: string }
        marketCap: { type: number }
        fdv: { type: number }
        txns:
          type: object
          additionalProperties:
            type: object
            additionalProperties: true
        volume:
          type: object
          additionalProperties: { type: number }
        priceChange:
          type: object
          additionalProperties: { type: number }
        liquidity:
          type: object
          additionalProperties: true
        pairCreatedAt: { type: integer }
        info:
          type: object
          additionalProperties: true
    DexProfilesResponse:
      type: object
      additionalProperties: false
      required: [kind, type, data, returned, total, upstream, fetchedAt]
      description: 'Kind `profiles` (types profiles/boosts/boosts-top). `total` is the FULL upstream list length; `returned` is what this response carries.'
      properties:
        kind:
          type: string
          enum: [profiles]
        type: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/DexProfile' }
        returned: { type: integer }
        total: { type: integer }
        upstream: { type: string }
        fetchedAt: { type: integer, format: int64 }
    DexOrdersResponse:
      type: object
      additionalProperties: false
      required: [kind, orders, boosts, upstream, fetchedAt]
      description: 'Kind `orders` — raw passthrough arrays, `[]` when upstream omitted the section.'
      properties:
        kind:
          type: string
          enum: [orders]
        orders:
          type: array
          items:
            type: object
            additionalProperties: true
        boosts:
          type: array
          items:
            type: object
            additionalProperties: true
        upstream: { type: string }
        fetchedAt: { type: integer, format: int64 }
    DexPairsResponse:
      type: object
      additionalProperties: false
      required: [kind, type, data, returned, total, upstreamTotal, chainsSeen, upstream, fetchedAt]
      description: |
        Kind `pairs` (search/tokens/tokens-v1/token-pairs). `data` is the
        local `limit` window of the matched set; `total` is the matched count;
        `upstreamTotal` is the UNFILTERED upstream pair count; `chainsSeen`
        counts every upstream pair by chainId. A locally applied chain filter
        shows up as `filteredBy` and, when it removed everything, as
        `data: []` plus `note` — never as an upstream error.
      properties:
        kind:
          type: string
          enum: [pairs]
        type: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/DexPair' }
        returned: { type: integer }
        total: { type: integer }
        upstreamTotal: { type: integer }
        chainsSeen:
          type: object
          additionalProperties: { type: integer }
        filteredBy: { type: string }
        note: { type: string }
        upstream: { type: string }
        fetchedAt: { type: integer, format: int64 }
    SignalCounts:
      type: object
      additionalProperties: false
      description: 'Section counters; a missing section is an ABSENT key, never 0.'
      properties:
        rows: { type: integer }
        rh: { type: integer }
        sol: { type: integer }
        surfaced: { type: integer }
        runs: { type: integer }
        revivals: { type: integer }
    SignalRow:
      type: object
      additionalProperties: true
      required: [id, ts, kind, chain, mint, symbol, name, url, mcap]
      description: 'Every optional metric is genuinely optional — a missing metric must never render as 0.'
      properties:
        id: { type: integer }
        ts: { type: integer, format: int64 }
        kind: { type: string }
        chain: { type: string }
        mint: { type: string }
        symbol: { type: string }
        name: { type: string }
        url: { type: string }
        mcap: { type: number }
        liq: { type: number }
        price: { type: number }
        ageMin: { type: number }
        score: { type: number }
        decision: { type: string }
        source: { type: string }
        image: { type: string }
        holdersCount: { type: integer }
        vetoes:
          type: array
          items: { type: string }
        volTrend: { type: number }
        topHolderPct: { type: number }
        nameReuse: { type: number }
        persistCount: { type: number }
        registryReuse: { type: number }
        sightings:
          type: object
          additionalProperties: false
          properties:
            n: { type: number }
            spanH: { type: number }
            sources: { type: number }
            surfaced: { type: number }
        socials:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              type: { type: string }
              url: { type: string }
    SignalsFeedResponse:
      type: object
      additionalProperties: true
      required: [chain, generatedAt, counts, rows, upstream]
      description: |
        Signal modes (index/feed/page): the upstream object spread FIRST, then
        the route's own `chain`/`generatedAt`/`counts`/`rows`/`upstream`
        override. `counts` is always present and `rows` always an array:
        `rows: []` + `counts: {}` must not hide "upstream returned nothing"
        from "everything filtered out". `generatedAt` is unix SECONDS.
      properties:
        v: { type: number }
        kind: { type: string }
        chain: { type: string }
        page: { type: integer }
        pages: { type: integer }
        pageRows: { type: integer }
        total: { type: integer }
        generatedAt: { type: integer, format: int64 }
        windowH: { type: number }
        solDelayMin: { type: number }
        counts: { $ref: '#/components/schemas/SignalCounts' }
        rows:
          type: array
          items: { $ref: '#/components/schemas/SignalRow' }
        upstream: { type: string }
    SignalsScoreboardResponse:
      type: object
      additionalProperties: true
      required: [kind, generatedAt, cohortDays, chains, upstream]
      description: |
        `type=scoreboard` — a DIFFERENT payload family (buckets + catches, no
        `rows`), forced to `kind: scoreboard`. Defaults `generatedAt` to now,
        `cohortDays` to 0 and `chains` to `{}` so the two cannot be confused
        with a real empty board.
      properties:
        kind:
          type: string
          enum: [scoreboard]
        v: { type: number }
        generatedAt: { type: integer, format: int64 }
        cohortDays: { type: integer }
        chains:
          type: object
          additionalProperties: { $ref: '#/components/schemas/ScoreboardChain' }
        upstream: { type: string }
    ScoreboardChain:
      type: object
      additionalProperties: true
      required: [latest, cohortDays, series, catches]
      description: 'One chain''s scoreboard: the latest bucket, the cohort window, the day series and the notable catches.'
      properties:
        latest: { $ref: '#/components/schemas/ScoreboardBucket' }
        cohortDays: { type: integer }
        series:
          type: array
          items: { $ref: '#/components/schemas/ScoreboardBucket' }
        catches:
          type: array
          items: { $ref: '#/components/schemas/ScoreboardCatch' }
    ScoreboardBucket:
      type: object
      additionalProperties: true
      required: [day, n, run, flat, dump, unknown]
      description: 'One day''s outcome histogram. `unknown` is a real class, not a default — an unclassified token is reported as such.'
      properties:
        day: { type: string }
        n: { type: integer }
        run: { type: integer }
        flat: { type: integer }
        dump: { type: integer }
        unknown: { type: integer }
    ScoreboardCatch:
      type: object
      additionalProperties: true
      required: [mint, symbol, score, decision, peak24, chain, day]
      description: 'A notable catch; `x24h` is optional (a missing multiple is absent, never 0).'
      properties:
        mint: { type: string }
        symbol: { type: string }
        score: { type: number }
        decision: { type: string }
        peak24: { type: number }
        chain: { type: string }
        day: { type: string }
        x24h: { type: number }
    RateLimitedError:
      type: object
      additionalProperties: false
      required: [error, detail, retryAfterSeconds]
      description: 'The middleware limiter body. Headers `X-RateLimit-Limit/-Remaining/-Reset/-Cost/-Scope` and `Retry-After` accompany it.'
      properties:
        error:
          type: string
          enum: [rate_limited]
        detail: { type: string }
        retryAfterSeconds: { type: integer }
