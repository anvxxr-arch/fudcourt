  # ==========================================================================
  # Admin control plane + Discord auth
  # ==========================================================================
  /api/admin/members:
    get:
      tags: [admin]
      operationId: listGuildMembers
      summary: Guild members with their resolved tier
      description: |
        Thin proxy to the Go api (backend/api, `FUDCOURT_API_URL`, default
        127.0.0.1:3103), which owns the admin tier check from the signed
        session cookie, the guild member listing and the role grant/revoke;
        the response (status, body, headers) is replayed verbatim. The bodies
        below are the frozen pre-migration contract the proxy preserves.
        `roleIds` echoes the configured role id table (`FUDCOURT_ROLE_TEAM` /
        `FUDCOURT_ROLE_ADMIN`; a role with no configured id has its KEY ABSENT
        from the object, not `null` — the Go wire uses `omitempty`).
      responses:
        '200':
          description: Member rows and the role id table.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminMembersResponse'
        '401':
          description: "`{\"error\": \"unauthorized\", \"detail\": \"requires admin tier\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: "`{\"error\": \"discord_unavailable\", \"detail\": ...}` — bot token/guild unset or Discord refused."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
    post:
      tags: [admin]
      operationId: setMemberRole
      summary: Grant or revoke the team/admin role of a guild member
      description: Requires the admin tier (checked server-side). `role` is `team` or `admin`; `action` is `add` or `remove`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleChangeInput'
      responses:
        '200':
          description: The applied change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleChangeResponse'
        '400':
          description: "`{\"error\": \"bad_request\", \"detail\": ...}` for a non-object body or an invalid userId/role/action."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          description: "`{\"error\": \"unauthorized\", \"detail\": \"requires admin tier\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: |
            `{"error": "discord_error", "detail": ...}` — Discord rejected the
            role change. Also the BFF's own proxy body when the Go api cannot
            be dialled: `{"error": "api unreachable: <reason>"}` (no `detail`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '503':
          description: "`{\"error\": \"discord_unconfigured\", \"detail\": \"FUDCOURT_ROLE_<ROLE> is not set\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
  /api/auth/login:
    get:
      tags: [auth]
      operationId: authLogin
      summary: Start the Discord OAuth2 flow (302 to Discord)
      description: |
        Parks a per-attempt nonce + validated `next` in the `fud_oauth_state`
        cookie and redirects to Discord's authorize URL (scopes identify +
        guilds). Misconfiguration is the only JSON failure.
      parameters:
        - name: next
          in: query
          schema: { type: string }
          description: 'Post-login destination. Unsafe values (absolute URLs, `//`, `..`, `?`/`#`/`%`) are replaced with `/`.'
      responses:
        '307':
          description: Temporary redirect to `https://discord.com/oauth2/authorize?...`; sets the `fud_oauth_state` cookie. (The Go api answers 307 Temporary Redirect — `writeRedirect` in `backend/api/cmd/api/routes.go` — and the Next BFF forwards the upstream status verbatim.)
          headers:
            Location:
              schema: { type: string }
              description: The Discord authorize URL.
            Set-Cookie:
              schema: { type: string }
              description: "`fud_oauth_state=<nonce>.<next>` (httpOnly, 10 minutes)."
        '500':
          description: "`{\"error\": \"auth_unconfigured\", \"detail\": \"FUDCOURT_CLIENT_ID and DISCORD_REDIRECT_URI must be set\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '405':
          description: '`{"error": "method not allowed"}` for a non-GET method (`methodGuard`); `Allow: GET`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/callback:
    get:
      tags: [auth]
      operationId: authCallback
      summary: OAuth2 callback — code → session cookie (307)
      description: |
        Validates `state` against the parked cookie value, exchanges the code,
        reads `/users/@me` and the guild member roles, resolves the tier and
        mints the signed session cookie. Every redirect failure ends at
        `/login?error=<code>` with one of: `discord_denied`, `bad_state`,
        `auth_unconfigured`, `token_exchange_failed`, `discord_api_failed`,
        `session_secret_missing`. ONE exception: an undecodable parked-state
        cookie answers `500 {"error":"internal","detail":"internal error"}` —
        a JSON body, not a redirect (the divergence is documented in the Go
        handler). No token, secret or Discord payload is ever echoed.
      parameters:
        - name: code
          in: query
          schema: { type: string }
          description: Discord authorization code.
        - name: state
          in: query
          schema: { type: string }
          description: 'Must equal the WHOLE parked `fud_oauth_state` value (`<nonce>.<next>`), not just the nonce — the TS original compared only the nonce and could never pass, so the Go api compares the full value.'
        - name: error
          in: query
          schema: { type: string }
          description: Discord error param; present ⇒ `discord_denied` redirect.
      responses:
        '307':
          description: |
            Success: redirect to the validated `next` path with the session
            cookie set (and `fud_oauth_state` cleared). Failure: redirect to
            `/login?error=<code>[&next=<path>]` with `fud_oauth_state` cleared.
          headers:
            Location:
              schema: { type: string }
              description: The `next` path, or `/login?error=<code>`.
            Set-Cookie:
              schema: { type: string }
              description: Session cookie on success; cleared `fud_oauth_state` always.
        '500':
          description: '`{"error": "internal", "detail": "internal error", "code": "internal", ...}` — an undecodable parked-state cookie (the one non-redirect failure).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/auth/logout:
    get:
      tags: [auth]
      operationId: authLogoutGet
      summary: Drop the session cookie (GET form, for `<a href>`)
      responses:
        '307':
          description: Temporary redirect to `/`; the session cookie is overwritten with maxAge 0.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        '405':
          description: '`{"error": "method not allowed"}` for anything but GET/POST; `Allow: GET, POST`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags: [auth]
      operationId: authLogoutPost
      summary: Drop the session cookie (POST form, for a form button)
      responses:
        '307':
          description: Temporary redirect to `/`; the session cookie is overwritten with maxAge 0.
          headers:
            Location:
              schema: { type: string }
            Set-Cookie:
              schema: { type: string }
        '429':
          $ref: '#/components/responses/RateLimited'
  # ==========================================================================
  # Market data (ranking / OHLC / pairs / signals) — proxied upstreams
  # ==========================================================================
  /api/markets:
    get:
      tags: [data]
      operationId: getMarkets
      summary: CoinGecko markets ranking (public, keyless)
      description: |
        Read-only proxy to api.coingecko.com `/coins/markets`, serving the
        tracker view. One fixed pool fetch (top-250) is cached and
        single-flighted through the shared limiter (60s TTL); search / sort /
        order / page / limit run LOCALLY over that pool and say so via
        `derived` + `pool` + `upstreamTotal` — the body never pretends
        CoinGecko filtered or sorted. Null upstream metrics stay null.
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [mcap, volume, price, change, name], default: volume }
          description: 'Strict — unknown values are a 400 naming the field, never ignored.'
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 'Integer 1..1000000 (never clamped).'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
          description: 'Integer 1..100 (never clamped).'
        - name: search
          in: query
          schema: { type: string }
          description: 'At most 64 chars (never truncated).'
      responses:
        '200':
          description: |
            Local slice of the mapped pool plus the pagination echo and the
            local-processing disclosure. `coins` rows are MarketsCoin (upstream
            rows mapped to camelCase; `quoteAsset` is the literal `USD`, and
            `lastPrice`/`marketCap`/`rank` fall back to 0 when upstream lacks
            the number). `timestamp` is unix seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketsResponse'
        '400':
          description: |
            `{"error": "unknown sort '<x>'"|"unknown order '<x>'", "detail":
            "expected one of ..."}` or `{"error": "<field> must be an integer,
            got '<raw>'"|"<field> must be between <min> and <max>, got <v>"|
            "search must be at most 64 chars, got <n>", "detail": "<field>"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: |
            `{"error": "upstream request failed"|"upstream <status> from
            CoinGecko"|"upstream returned a non-list payload"|"upstream
            returned non-JSON"|[empty-pool refusal]", "detail": ...}` — a
            CoinGecko 429 passes through with its own real status, never as 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  /api/market/forex:
    get:
      tags: [data]
      operationId: getMarketForex
      summary: Forex major-pairs board (public, keyless)
      description: |
        Read-only proxy to `open.er-api.com/v6/latest/USD` (exchangerate-api
        free tier, ECB-fed, republished daily) serving the `/market/forex`
        section of the market hub. One keyless GET returns 160+ USD-base rates;
        the board shows a CURATED set of major + Asia pairs (16), DERIVED
        locally from those rates (`EUR/USD = 1 / rate(EUR)`) and labelled
        `derived` — the provider never shipped these pairs and the body never
        pretends it did. Null stays null. The shared limiter caches the feed for
        `FOREX_TTL_MS` (5 min) with single-flight, so a board reload inside the
        window costs zero upstream calls.
      responses:
        '200':
          description: |
            The curated pair set plus its provenance. `pairs[]` are ForexPair
            rows (`rate` is the displayed quote, `inverse` its reciprocal);
            `base` is the upstream base code (always `USD` today); `updated` is
            unix seconds or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForexResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: |
            `{"error": "upstream request failed"|"upstream returned non-JSON"|
            "upstream returned no rates"|"no curated pair could be derived from
            the upstream rates", "detail": ...}` — an empty/absent rate set is a
            loud 502, never a fake 200 with zero pairs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  /api/market/commodity:
    get:
      tags: [data]
      operationId: getMarketCommodity
      summary: Commodity front-month futures board (public, keyless)
      description: |
        Read-only proxy to the Yahoo Finance CHART endpoint (public, keyless),
        one call per symbol, serving the `/market/commodity` section. The batch
        quote endpoint answers 401 without a crumb+cookie (measured), so the
        board fans out one chart call per symbol through the shared limiter
        (<=5/s, per-symbol TTL). A symbol that fails is reported in `failed[]`
        with its reason rather than dropped; a partial board is still a 200 and
        only an all-symbols failure is a loud 502. Curated labels override
        Yahoo's contract-calendar names.
      responses:
        '200':
          description: |
            The quote rows plus the failure ledger. `quotes[]` are MarketQuote
            rows (upstream `regularMarketVolume: 0` means "not published" and
            the UI renders `—`); `failed[]` names each symbol that did not
            resolve with its reason; `asOf` is unix seconds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketQuoteResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: |
            `{"error": "no quotes returned", "detail": "all <N> symbols
            failed", "failed": [...]}` — every symbol failed; never a fake
            empty 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  /api/market/stock:
    get:
      tags: [data]
      operationId: getMarketStock
      summary: Stock & index board by region (public, keyless)
      description: |
        Read-only proxy to the Yahoo Finance CHART endpoint (public, keyless),
        one call per symbol, serving the `/market/stock` section. `region` is
        OUR parameter selecting a curated symbol allowlist; a value outside
        `STOCK_REGIONS` is a strict 400 naming the field — never clamped, never
        silently defaulted (absent means the documented default, `us`). Same
        honest-by-construction rules as `/api/market/commodity`: a failed symbol
        is reported in `failed[]`, a partial board is a 200, only an
        all-symbols failure is a 502. Watch the QUOTE UNIT: LSE equities report
        in `GBp` (pence) upstream and are shown as sent — never converted.
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum: [us, asia, europe]
            default: us
          description: 'Strict — a value outside the enum is a 400 naming the field, never clamped or defaulted.'
      responses:
        '200':
          description: |
            The quote rows for the region plus the failure ledger and the region
            echo. `quotes[]` are MarketQuote rows; `failed[]` names each symbol
            that did not resolve.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketQuoteResponse'
        '400':
          description: |
            `{"error": "invalid region", "detail": "region must be one of: us,
            asia, europe"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: |
            `{"error": "no quotes returned", "detail": "all <N> <region>
            symbols failed", "failed": [...]}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  /api/ticker:
    get:
      tags: [data]
      operationId: getTicker
      summary: Cross-venue CEX ticker board (OKX + Bybit + 8 more via CCXT)
      description: |
        Sweeps every venue in `exchanges` for the fixed `universe` allowlist of
        quotable pairs and returns one row per pair with EACH venue's own
        quote plus their divergence (`spread`), so one venue going wrong is
        visible instead of silently becoming the number everyone reads. One
        sweep (71-80s cold) serves every search/sort/page for 60s; a stale copy
        (≤1h) is served immediately while a refresh runs in the background, and
        only a wholly missing snapshot blocks. No market cap / supply / rank:
        no venue reports them keyless, so they are absent, never invented.
      parameters:
        - name: sort
          in: query
          schema: { type: string, enum: [symbol, price, change, volume, spread], default: volume }
        - name: order
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
          description: 'Nulls always sort last in either direction.'
        - name: search
          in: query
          schema: { type: string }
          description: 'At most 16 chars; matched case-insensitively against symbol and base.'
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
          description: 'Integer 1..50 (never clamped).'
        - name: page
          in: query
          schema: { type: integer, default: 1 }
          description: 'Integer >= 1 (never clamped).'
        - name: type
          in: query
          schema: { type: string, enum: [spot, swap, future, option, all], default: all }
          description: "'all' or one of the four instrument types; unknown values are a 400, never a silent fall-through to spot."
      responses:
        '200':
          description: |
            The page window plus the echo and the measured venue/type tables.
            `timestamp` is unix ms. `derived` states that filtering, sorting and
            pagination happened locally.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TickerResponse'
        '400':
          description: "`{\"error\": \"bad_request\", \"detail\": \"sort must be one of ...\"|\"order must be one of ...\"|\"search must be at most 16 characters\"|\"limit must be an integer 1..50\"|\"page must be an integer >= 1\"|\"type must be 'all' or one of ...\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: "`{\"error\": \"upstream_unreachable\", \"detail\": <real reason>}` when the sweep fails, or `{\"error\": \"upstream_empty\", \"detail\": \"no venue returned a quote for any symbol\"}` — never a fake 200 with zero rows."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  /api/ticker/instruments:
    get:
      tags: [data]
      operationId: listInstruments
      summary: Which dated instruments exist for a coin (per venue, per type)
      description: |
        Everything offered here comes from the venues' own market lists (loaded
        once a day), so every selectable expiry/strike is known to be listed
        rather than constructed. Strikes are reported PER EXPIRY because they
        genuinely differ by date. `default` is computed with the same helper the
        board uses and a real spot price, so the preselected instrument here
        and the one a board row lands on cannot disagree.
      parameters:
        - name: symbol
          in: query
          required: true
          description: 'Pair like `BTC/USDT`, uppercased; must be on the ticker symbol allowlist. Max 16 chars.'
          schema:
            type: string
      responses:
        '200':
          description: 'Per-type summaries (`types`) and per-venue instrument counts (`venues`). `timestamp` is unix ms.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentsResponse'
        '400':
          description: "`{\"error\": \"missing_symbol\", \"detail\": \"pass ?symbol=BTC/USDT\"}` or `{\"error\": \"symbol_too_long\", \"detail\": \"max 16 characters\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '404':
          description: "`{\"error\": \"unknown_symbol\", \"detail\": \"<SYMBOL> is not on the ticker allowlist\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/ticker/instrument:
    get:
      tags: [data]
      operationId: getInstrument
      summary: One specific instrument priced across every venue that lists it
      description: |
        The selection (expiry/strike/kind) is resolved against each venue's own
        market list rather than by string-building a ccxt symbol — the same
        option is spelled differently on OKX and Bybit, and a constructed
        symbol is rejected by the venue it was wrong for. `notListed` (the
        venue has no such instrument) and `failed` (it should have answered and
        did not) are kept apart because they call for different reactions.
        `price` is the median across venues that priced it, `null` when none
        did. Omitting expiry/strike/kind means "whatever that type defaults to".
      parameters:
        - { name: base, in: query, required: true, schema: { type: string }, description: 'Coin base, e.g. `BTC`; uppercased, max 16 chars.' }
        - { name: type, in: query, schema: { type: string, enum: [spot, swap, future, option], default: spot } }
        - { name: expiry, in: query, schema: { type: string }, description: 'ISO date (e.g. 2026-09-29); normalized to `YYYY-MM-DD`.' }
        - { name: strike, in: query, schema: { type: string }, description: 'Must be numeric when given.' }
        - { name: kind, in: query, schema: { type: string, enum: [call, put] } }
      responses:
        '200':
          description: "`{base, type, typeLabel, request, instruments, settlements, quotes, priced, price, notListed, failed, timestamp}` — `request` echoes the normalized selection; `settlements` are the settlement currencies actually quoted (prices across them differ by a real basis). `timestamp` is unix ms."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentResponse'
        '400':
          description: "`{\"error\": \"missing_base\", \"detail\": \"pass ?base=BTC\"}` | `{\"error\": \"base_too_long\"|\"bad_type\"|\"bad_strike\"|\"bad_kind\"|\"bad_expiry\", \"detail\": ...}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/dex:
    get:
      tags: [data]
      operationId: getDex
      summary: DexScreener read proxy (profiles / boosts / search / tokens / pairs / orders)
      description: |
        Proxies **DexScreener** public endpoints (`https://api.dexscreener.com`)
        through the shared cache + single-flight limiter; `X-Cache:
        HIT|MISS|COALESCED` reports which arm served the response. PUBLIC — not
        in `guard.ts` `TEAM_API_ROUTES`, so no tier gate. `type` chooses both
        the upstream endpoint and the response family; `limit` is CLAMPED
        (never refused, unlike the other data routes). `search` is the one type
        whose chain narrowing happens locally: DexScreener ignores a
        server-side chain filter, so the returned set is filtered here and the
        full spread is still reported as `chainsSeen`.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [profiles, boosts, boosts-top, search, tokens, tokens-v1, token-pairs, orders]
            default: profiles
          description: 'Unknown values are a 400 naming the field. `tokens-v1` is a distinct single-token endpoint (deepest single pair); `token-pairs` is the multi-pair one.'
        - name: limit
          in: query
          schema: { type: integer, default: 30 }
          description: 'Clamped: `parseInt(raw||30)`; non-finite or <1 becomes 30, otherwise `min(n, 100)`. Never refused.'
        - name: chain
          in: query
          schema: { type: string }
          description: 'Must be in DEX_CHAINS (23 entries) when given, else 400. For `search` it is applied LOCALLY; for the token/order types it defaults to `solana`.'
        - name: q
          in: query
          schema: { type: string }
          description: 'Required (non-empty) for `type=search`.'
        - name: address
          in: query
          schema: { type: string }
          description: 'Required for `tokens-v1`/`token-pairs`/`orders`; must be a base58 mint, a `0x`+40-hex EVM address, or a dotted NEAR-style name.'
        - name: addresses
          in: query
          schema: { type: string }
          description: 'Required for `type=tokens`; comma-separated, at most 30, each validated as a mint of one of the three families.'
      responses:
        '200':
          description: |
            One of three families: `kind: profiles` (profiles/boosts/boosts-top:
            trimmed profile rows + `returned`/`total`), `kind: orders`
            (`orders`/`boosts` raw passthrough arrays, `[]` when absent), or
            `kind: pairs` (search/tokens/tokens-v1/token-pairs: raw upstream
            pairs + `returned`/`total`/`upstreamTotal`/`chainsSeen`, and
            `filteredBy`+`note` when a LOCAL chain filter removed everything).
            All carry `upstream` (the DexScreener URL) and `fetchedAt` (unix
            seconds).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DexProfilesResponse'
                  - $ref: '#/components/schemas/DexPairsResponse'
                  - $ref: '#/components/schemas/DexOrdersResponse'
        '400':
          description: |
            `fail()` refusals — `{"error": "unknown type '<x>'", "detail":
            "expected one of profiles, boosts, boosts-top, search, tokens,
            tokens-v1, token-pairs, orders"}`, `{"error": "unknown chain '<x>'",
            "detail": "expected one of <23 chains>"}`, `{"error": "search needs
            a non-empty \\`q\\`"}`, `{"error": "\\`address\\` is not a valid
            token address", "detail": "expected a base58 mint, a 0x EVM
            address, or a dotted name"}`, `{"error": "tokens needs
            \\`addresses\\`"}`, `{"error": "tokens accepts at most 30
            addresses"}`, `{"error": "<n> address(es) are not valid mints",
            "detail": "<bad addresses joined by ','>"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          description: 'Upstream Cloudflare 1015, relayed with its real status — `{"error": "upstream <label> rate limited (HTTP 429, Cloudflare 1015) — too many requests in a short window", "detail": <first 200 chars | "no retry-after header">}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '502':
          description: |
            `{"error": "upstream <label> unreachable: <msg>"}` (fetch/20 s
            timeout), `{"error": "upstream <label> returned a non-JSON body"}`,
            `{"error": "upstream <type> did not return a list"}`, or
            `{"error": "upstream <type> returned an unrecognised shape"}`. A
            non-429 upstream non-2xx is relayed with its REAL status and
            `{"error": "upstream <label> HTTP <status>", "detail": <first 200
            chars>}` — never a fake 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  /api/signals:
    get:
      tags: [data]
      operationId: getSignals
      summary: Signals board passthrough (index / feed / page / scoreboard)
      description: |
        Passthrough of `https://data-public.vercel.app/api/<mode>?chain=<chain>[&n=<n>]`
        with `chain`/`generatedAt`/`counts`/`rows`/`upstream` defaulted. The
        upstream's own object is spread FIRST, so upstream keys survive
        untouched. `type=scoreboard` is a SEPARATE payload family (buckets +
        catches) and does NOT carry `rows` — feeding it through the row
        normalizer would fabricate a "no signals" answer. PUBLIC — not in
        `guard.ts` `TEAM_API_ROUTES`. The chain allowlist is PER MODE (so
        `chain=all` is a 400 for `index`/`scoreboard`, valid for `feed`/`page`).
        Every non-2xx upstream (including its own 400/404) collapses to a 502
        with the real status quoted in the message — never a fake 200.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [index, feed, page, scoreboard]
            default: index
          description: 'Validated FIRST — the chain allowlist is looked up by mode, so an unknown mode is a 400.'
        - name: chain
          in: query
          schema: { type: string, default: solana }
          description: 'Lowercased. Allowed set depends on `type`: index/scoreboard = solana|robinhood; feed/page = solana|robinhood|all.'
        - name: n
          in: query
          schema: { type: integer, default: 2 }
          description: 'Only read for `type=page`. `parseInt(raw||2)`; non-finite becomes 2; the value is passed through UNCLAMPED and validated: <2 is a 400, >10 is a 404 (mirroring upstream), never silently clamped to another page.'
      responses:
        '200':
          description: |
            The upstream payload with the route's own defaults applied. Signal
            modes carry `rows`/`counts`; `type=scoreboard` carries
            `chains`/`cohortDays` and NO `rows`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SignalsFeedResponse'
                  - $ref: '#/components/schemas/SignalsScoreboardResponse'
        '400':
          description: |
            `{"error": "type must be one of index, feed, page, scoreboard"}`
            (no `detail`), `{"error": "chain must be one of <allowed> for
            type=<mode>"}`, or `{"error": "bad chain or page", "detail": "page
            <n> is outside the upstream range 2..10"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '404':
          description: "`{\"error\": \"no such page\", \"detail\": \"page <n> is outside the upstream range 2..10\"}` (n > 10)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          description: "`{\"error\": \"upstream /api/<mode> HTTP <status>\", \"detail\": <first 200 chars>}` (any non-2xx upstream) or `{\"error\": \"upstream unreachable: <msg>\"}` (fetch failure / 25 s timeout)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FailError'
  # ==========================================================================
  # Research read proxies — THIN, HONEST PROXIES to the Go `fudcourt-data` sidecar
  # (backend/data, 127.0.0.1:3101) and the Rust `fudcourt-reconciled` service
  # (backend/sync, 127.0.0.1:3102). The sidecars own ALL validation (mode/key
  # tables, limit ranges, refusals); the web routes forward status, body and
  # cache headers VERBATIM and only answer 502 `{error: "<family> unreachable:
  # <reason>", upstream}` when the sidecar itself cannot be reached.
  # ==========================================================================
  /api/cryptorank:
    get:
      tags: [data]
      operationId: getCryptorank
      summary: CryptoRank read proxy (mode-only input, never a raw path)
      description: |
        Forwards the query string untouched to the Go sidecar, which owns
        mode/key validation, the disabled-mode refusal, the browser-fingerprint
        fetch, the disk cache and the 429 backoff. Success bodies are
        `CrEnvelope` (kind/upstream/fetchedAt/cache/count plus the mode's own
        section). Headers `X-CR-Upstream`, `X-CR-Cache`, `Cache-Control` are
        forwarded from the sidecar. Go bodies end in ONE trailing newline and
        use struct key order — field-compatible, not byte-identical.
      parameters:
        - name: mode
          in: query
          required: true
          description: |
            One of the 28 CR_MODES. `funding` and `unlocks` are refused with 503
            (upstream's /_next/data class serves synthetic decoy). Keyed modes
            (`categories`, `coin`, `chain`, `tag`, `ecosystem`, `rwaasset`,
            `newstag`) take `key`; list modes (`exchanges`, `launchpool`,
            `nodesale`) take `key` from their own whitelists.
          schema:
            type: string
            enum:
              [home, coins, trending, gainers, losers, funding, unlocks, categories,
               exchanges, coin, listings, blockchains, chain, launchpool, nodesale,
               news, tags, tag, ecosystems, ecosystem, rwa, rwaasset, quarterly,
               prediction, converter, media, newstag, aioverview]
        - name: key
          in: query
          description: |
            Per-mode key. Slug modes: `^[a-z0-9][a-z0-9-]{0,63}$`
            (defaults: categories=chain, coin=bitcoin, chain=ethereum,
            tag=layer-1, ecosystem=ethereum, newstag=defi). `rwaasset`:
            `<bonds|commodities|etfs|stocks>/<slug>` (default stocks/wendy-s).
            `exchanges`: cex/spot|dex/spot|perpetuals|cex-transparency (default
            cex/spot). `launchpool`: past|upcoming|active (default past).
            `nodesale`: past|active|upcoming (default past).
          schema:
            type: string
        - name: fresh
          in: query
          description: "`fresh=1` disables the TTL cache for this request only."
          schema:
            type: string
            enum: ['1']
      responses:
        '200':
          description: |
            The mode's shaped envelope. Response headers `X-CR-Upstream`,
            `X-CR-Cache` (MISS|HIT), `Cache-Control` come from the sidecar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrEnvelope'
        '400':
          description: |
            Sidecar refusals — `{"error": "unknown mode", ...}` (the 28-mode
            array is shipped verbatim in the body), `{"error": "invalid key",
            "detail": ..., "mode": ..., "key": ...}`, `{"error": "invalid
            exchange list"|"invalid launchpool list"|"invalid nodesale list", ...}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '404':
          description: "`{\"error\": \"upstream 404: no such resource\", ...}` or the newstag soft-404 refusal."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '429':
          description: |
            NOT emitted by the sidecar for an upstream throttle: an upstream
            429 is retried three times and then reported as a **502** with
            `"upstreamStatus": 429` (`fetchWithRetry` → `writeFetchError` in
            `backend/data/cmd/data/main.go`). A client that only
            special-cases 429 for backoff will never see one — branch on the
            502 body's `upstreamStatus` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '502':
          description: "`{\"error\": <real reason>, \"upstreamStatus\": <int>, \"upstream\": ..., \"kind\": <mode>}` — upstream wall or layout drift (this branch carries NO `detail` key), an exhausted retry, or (proxy-level) `fudcourt-data unreachable: <reason>`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '503':
          description: "`{\"error\": <CR_DISABLED_REASON>, \"kind\": <mode>, \"upstream\": ...}` — mode `funding`/`unlocks` (synthetic decoy class)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
  /api/llama:
    get:
      tags: [data]
      operationId: getLlama
      summary: DeFiLlama read proxy (api.llama.fi)
      description: |
        Modes: `chains` (full /v2/chains re-sorted by tvl desc), `protocols`
        (head `top` of /protocols by tvl desc), `historical` (tail `days` of
        /v2/historicalChainTvl). Only the mode's own param is read; a param for
        another mode is ignored. Refusals are never clamped. Response header
        `X-Cache` (MISS|HIT) comes from the sidecar.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [chains, protocols, historical], default: chains }
        - name: top
          in: query
          description: "protocols only — integer 1..200 (default 50), never clamped."
          schema: { type: integer, default: 50 }
        - name: days
          in: query
          description: "historical only — integer 1..3288 (default 365), never clamped."
          schema: { type: integer, default: 365 }
      responses:
        '200':
          description: |
            `{kind, rows, upstream, fetchedAt, upstreamTotal, derived}` — `rows`
            is the upstream payload passed through (shape per mode; upstream may
            add fields).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlamaEnvelope'
        '400':
          description: |
            `{"error": "unknown mode '<m>'", "detail": "expected one of chains,
            protocols, historical"}` or `{"error": "<param> must be an integer,
            got '<x>'"}` / `{"error": "<param> must be between 1 and <max>, got
            <x>"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '429':
          description: Upstream rate limit, status kept and real text quoted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '502':
          description: |
            `{"error": "upstream <mode> unreachable: <err>"}` (transport
            failure), or (proxy-level) `fudcourt-data unreachable: <reason>`.
            NOTE: an upstream non-2xx (other than 429) is NOT rewritten to 502 —
            the sidecar passes the real upstream status through (a CoinGecko
            500/503 reaches the client as 500/503), and a 200 body that is not
            the expected list is served as HTTP 200 with an error body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
  /api/news:
    get:
      tags: [data]
      operationId: getNews
      summary: Cointelegraph RSS read proxy
      description: |
        One feed, two strictly-validated params. `items` is the `limit` head
        while `total` is the full parsed count (honest, not the same number).
        An empty feed is a loud 502, never an empty list. Response header
        `X-Cache` (MISS|HIT).
      parameters:
        - name: source
          in: query
          schema: { type: string, enum: [cointelegraph], default: cointelegraph }
        - name: limit
          in: query
          description: "Integer 1..100 (default 30), never clamped."
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: "`{items, total, upstream, timestamp}` — timestamp in unix ms."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsEnvelope'
        '400':
          description: |
            `{"error": "unknown source '<s>'", "detail": "expected one of
            cointelegraph"}` or `{"error": "limit must be an integer, got
            '<x>'"}` / `{"error": "limit must be between 1 and 100, got <x>"}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '429':
          description: 'Upstream rate limit (`kind: "rate-limit"` in the sidecar''s error mapping).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        default:
          description: |
            An upstream non-2xx other than 429 (e.g. 403/500/503) is relayed
            with its REAL status — the response set is not limited to the
            statuses listed above. An empty/blocked feed is a loud 502, never
            an empty list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '502':
          description: "`{\"error\": ..., \"detail\": <upstream body>}` for an empty/blocked feed or transport failure, or (proxy-level) `fudcourt-data unreachable: <reason>`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
  /api/reconcile:
    get:
      tags: [data]
      operationId: getReconcile
      summary: Wallet reconciliation (Rust `fudcourt-reconciled`, DR-014)
      description: |
        Verbatim pass-through of the Rust service's JSON — only the body's
        `source` field names the implementation that produced the numbers. NO
        silent fallback to the TS oracle (`frontend/web/src/features/treasury/reconcile.ts` is a test
        artifact): service down ⇒ 502 with the real reason. Team-tier read
        (middleware + `frontend/web/src/platform/auth/guard.ts`). Headers `X-Reconcile-Upstream`,
        `Cache-Control: no-store`.
      responses:
        '200':
          description: "`{rows, wallets, walletSummary, source}` — rows sorted by biggest |diff| first; `walletSummary` is a map keyed by wallet name."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconcileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Database failure from the service, forwarded verbatim with its own real reason (never a partial board).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
        '502':
          description: "`{\"error\": \"reconcile unreachable: <reason>\", \"upstream\": ...}` — unreachable, refused, DNS failure or the 45s proxy timeout."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SidecarError'
components:
  parameters:
    ExecutionId:
      name: id
      in: path
      required: true
      description: Execution id.
      schema:
        type: string
    AccountId:
      name: id
      in: path
      required: true
      description: Credential record id.
      schema:
        type: string
  responses:
    Unauthorized:
      description: No session, or the session lacks the `team` tier (fail-closed).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    NotFound:
      description: Not found — or not yours (ownership is never leaked, PRD §108).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBasic'
    UpstreamFailure:
      description: Exchange/venue probe failed; `category` is the retry taxonomy (PRD §78).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    Lifecycle:
      description: The updated execution record.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LifecycleResponse'
    InvalidTransition:
      description: The lifecycle intent is not applicable in the current status (PRD §57).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    MutationUnauthorized:
      description: |
        `requireMutationAuth` refusal (`frontend/web/src/platform/auth/mutation.ts`):
        the signed session cookie is missing or below the `team` tier, so a write
        method is refused server-side before any handler runs. The body is the
        same `{error, detail}` pair a read that fails the middleware gate gets.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorDetail'
    RateLimited:
      description: |
        The inbound limiter refused the request (`frontend/web/src/middleware.ts` +
        `platform/http/rate-limit-inbound.ts`). Carries the `X-RateLimit-*`
        header set and `Retry-After`; the limiter fails OPEN (a counter failure
        serves the request), so a 429 here is always a measured spend, never a
        guess.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitedError'
  schemas:
    # ------------------------------------------------------------------
    # Enumerations — frozen in frontend/web/src/platform/executor/types.ts.
    # ------------------------------------------------------------------
    MarketType:
      type: string
      description: 'Normalized market type. MVP = spot + USDT-margined linear perpetual only.'
      enum:
        - spot
        - linear_perp
    Side:
      type: string
      description: 'Order side. Spot sell-open is refused outside explicit margin support (PRD §89).'
      enum:
        - buy
        - sell
    Intent:
      type: string
      description: What the user wants the order to do to the position.
      enum:
        - open
        - close
        - reduce
    ExchangeId:
      type: string
      description: 'Exchange identity. Keys in `exchange:*:*` venue keys (PRD §49).'
      enum:
        - binance
        - bybit
        - mexc
    VenueKey:
      type: string
      description: 'Internal unique key: `${exchange}:${marketType}:${symbol}` (PRD §49).'
    TimeInForce:
      type: string
      description: 'Normalized time-in-force (PRD §27). The adapter maps to venue support.'
      enum:
        - GTC
        - IOC
        - FOK
    ExecutionUrgency:
      type: string
      description: 'Execution urgency (PRD §35). Maps to internal strategy aggressiveness.'
      enum:
        - passive
        - balanced
        - aggressive
        - immediate
    LeverageMode:
      type: string
      description: 'Leverage selection policy (PRD §19). MVP ships AUTO_SAFE only.'
      enum:
        - manual
        - auto_safe
    MarginMode:
      type: string
      description: 'Margin mode (PRD §92). Product default recommendation is ISOLATED.'
      enum:
        - isolated
        - cross
    PositionMode:
      type: string
      description: 'Position mode (PRD §91).'
      enum:
        - one_way
        - hedge
    ExecutionStatus:
      type: string
      description: 'Execution lifecycle (PRD §57).'
      enum:
        - DRAFT
        - CALCULATED
        - VALIDATED
        - READY
        - RUNNING
        - PARTIALLY_FILLED
        - FILLED
        - PAUSED
        - CANCEL_REQUESTED
        - CANCELLED
        - FAILED
        - RISK_STOPPED
        - EXPIRED
        - RECONCILING
        - STOPPED
    ChildOrderStatus:
      type: string
      description: 'Child order lifecycle (PRD §58).'
      enum:
        - PLANNED
        - SUBMITTING
        - OPEN
        - PARTIAL
        - FILLED
        - CANCELLING
        - CANCELLED
        - REJECTED
        - EXPIRED
        - UNKNOWN
    CredentialHealth:
      type: string
      description: 'Credential health (PRD §47).'
      enum:
        - ACTIVE
        - INVALID
        - EXPIRED
        - PERMISSION_ERROR
        - RATE_LIMITED
        - REVOKED
        - UNKNOWN
    ErrorCategory:
      type: string
      description: 'Retry taxonomy (PRD §78). Only `network_retryable`/`rate_limited`/`exchange_overload` may retry.'
      enum:
        - network_retryable
        - rate_limited
        - exchange_overload
        - invalid_order
        - permission_error
        - insufficient_balance
        - fatal
        - unknown
    RiskBreachPolicy:
      type: string
      description: 'When projected risk exceeds the budget (PRD §37). Default RESIZE_THEN_STOP.'
      enum:
        - resize_then_stop
        - pause
        - stop
    ExistingPositionPolicy:
      type: string
      description: 'Existing-position policy at open time (PRD §93). MVP: ADD and REJECT.'
      enum:
        - add
        - reject
    ExecutionMode:
      type: string
      description: 'Execution mode (PRD §118). LIVE is fail-closed behind the kill switch.'
      enum:
        - preview
        - paper
        - live
    StopMode:
      type: string
      description: 'How a protective stop is managed (PRD §39). Native preferred.'
      enum:
        - native
        - synthetic
        - hybrid
    ExecutionEventName:
      type: string
      description: 'Immutable event names (PRD §63). Canonical cross-service ids + aliases: shared/contracts/events/catalog.json.'
      enum:
        - EXECUTION_CREATED
        - RISK_CALCULATED
        - PLAN_CREATED
        - EXECUTION_STARTED
        - ORDER_SUBMITTED
        - ORDER_PARTIALLY_FILLED
        - ORDER_FILLED
        - ORDER_CANCELLED
        - ORDER_REJECTED
        - RISK_RECALCULATED
        - PLAN_RESIZED
        - EXECUTION_PAUSED
        - EXECUTION_RESUMED
        - EXECUTION_COMPLETED
        - EXECUTION_FAILED
        - EXECUTION_RISK_STOPPED
        - EXECUTION_CANCELLED
        - RECONCILIATION_MISMATCH
        - EXTERNAL_STATE_CHANGE
    BalanceBasis:
      type: string
      description: 'Balance basis (PRD §10) — percentage sizing MUST name its source explicitly.'
      enum:
        - spot_available
        - spot_equity
        - futures_available
        - futures_equity
        - total_exchange_equity
        - asset_equity
        - custom
    SizingMode:
      type: string
      description: The 9 sizing modes of `SizingDefinition['mode']`.
      enum:
        - risk_usd
        - risk_percent
        - allocation_usd
        - allocation_percent
        - notional_usd
        - fixed_quantity
        - fixed_margin
        - target_profit_usd
        - target_profit_percent
    # ------------------------------------------------------------------
    # Sizing / entry / exit definitions
    # ------------------------------------------------------------------
    SizingDefinition:
      description: 'Sizing (PRD §12, §52) — risk-oriented, capital-oriented, outcome-oriented. Exactly one of 9 modes.'
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode:
              type: string
              enum: [risk_usd]
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [mode, value, balanceBasis]
          properties:
            mode:
              type: string
              enum: [risk_percent]
            value:
              type: number
            balanceBasis:
              $ref: '#/components/schemas/BalanceBasis'
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode:
              type: string
              enum: [allocation_usd]
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [mode, value, balanceBasis]
          properties:
            mode:
              type: string
              enum: [allocation_percent]
            value:
              type: number
            balanceBasis:
              $ref: '#/components/schemas/BalanceBasis'
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode:
              type: string
              enum: [notional_usd]
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode:
              type: string
              enum: [fixed_quantity]
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode:
              type: string
              enum: [fixed_margin]
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [mode, value]
          properties:
            mode:
              type: string
              enum: [target_profit_usd]
            value:
              type: number
        - type: object
          additionalProperties: false
          required: [mode, value, balanceBasis]
          properties:
            mode:
              type: string
              enum: [target_profit_percent]
            value:
              type: number
            balanceBasis:
              $ref: '#/components/schemas/BalanceBasis'
      discriminator:
        propertyName: mode
    EntryDefinition:
      description: 'Entry definition (PRD §51).'
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [market]
        - type: object
          additionalProperties: false
          required: [type, price]
          properties:
            type:
              type: string
              enum: [limit]
            price:
              type: number
            postOnly:
              type: boolean
      discriminator:
        propertyName: type
    PriceDefinition:
      type: object
      additionalProperties: false
      required: [price]
      properties:
        price:
          type: number
    TakeProfitDefinition:
      type: object
      additionalProperties: false
      required: [price]
      properties:
        price:
          type: number
        fraction:
          type: number
          description: 'Fraction of the position to close at this level (0..1). Absent = full close.'
    ScaleLevel:
      type: object
      additionalProperties: false
      required: [price, fraction]
      description: 'One scale level (PRD §33, §34).'
      properties:
        price:
          type: number
        fraction:
          type: number
          description: Fraction of the total quantity (0..1).
    LeverageDefinition:
      description: 'Leverage selection (PRD §19–§20).'
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode, leverage]
          properties:
            mode:
              type: string
              enum: [manual]
            leverage:
              type: number
        - type: object
          additionalProperties: false
          required: [mode]
          properties:
            mode:
              type: string
              enum: [auto_safe]
            maxLeverage:
              type: number
              description: 'Cap for the auto selection (PRD §19).'
            liquidationBufferPct:
              type: number
              description: 'Required SL→liquidation buffer as fraction of stop distance (0.2 = 20%).'
            maxMarginPct:
              type: number
              description: Max fraction of available balance used as margin.
      discriminator:
        propertyName: mode
    # ------------------------------------------------------------------
    # Execution definition / request
    # ------------------------------------------------------------------
    TwapConfig:
      type: object
      additionalProperties: false
      required: [durationMs, orderType]
      description: 'TWAP configuration (PRD §29).'
      properties:
        durationMs:
          type: number
        slices:
          type: number
        intervalMs:
          type: number
        quantityJitterPct:
          type: number
        intervalJitterPct:
          type: number
        priceLimit:
          type: number
        orderType:
          type: string
          enum: [market, limit, maker]
        maxSlippageBps:
          type: number
        maxSpreadBps:
          type: number
    ExecutionDefinition:
      description: 'Execution definition — how the strategy works the order. Exactly one of 8 types.'
      oneOf:
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type:
              type: string
              enum: [market]
        - type: object
          additionalProperties: false
          required: [type, price]
          properties:
            type:
              type: string
              enum: [limit]
            price:
              type: number
            postOnly:
              type: boolean
        - type: object
          additionalProperties: false
          required: [type, durationMs]
          properties:
            type:
              type: string
              enum: [twap]
            durationMs:
              type: number
            slices:
              type: number
            intervalMs:
              type: number
            config:
              $ref: '#/components/schemas/TwapConfig'
        - type: object
          additionalProperties: false
          required: [type, durationMs, urgency]
          properties:
            type:
              type: string
              enum: [adaptive_twap]
            durationMs:
              type: number
            urgency:
              $ref: '#/components/schemas/ExecutionUrgency'
            slices:
              type: number
            config:
              $ref: '#/components/schemas/TwapConfig'
        - type: object
          additionalProperties: false
          required: [type, visibleQuantity]
          properties:
            type:
              type: string
              enum: [iceberg]
            visibleQuantity:
              type: number
        - type: object
          additionalProperties: false
          required: [type, urgency]
          properties:
            type:
              type: string
              enum: [chase_limit]
            urgency:
              $ref: '#/components/schemas/ExecutionUrgency'
            maxReplacements:
              type: number
              description: 'Cap on cancel/replace cycles before the strategy gives up (PRD §32).'
            maxChaseDistance:
              type: number
              description: Furthest the peg may travel from the arrival price before chasing stops.
            minReplacementIntervalMs:
              type: number
              description: Minimum gap between two cancel/replace cycles, so we do not thrash.
        - type: object
          additionalProperties: false
          required: [type, levels]
          properties:
            type:
              type: string
              enum: [scale_in]
            levels:
              type: array
              items:
                $ref: '#/components/schemas/ScaleLevel'
        - type: object
          additionalProperties: false
          required: [type, levels]
          properties:
            type:
              type: string
              enum: [scale_out]
            levels:
              type: array
              items:
                $ref: '#/components/schemas/ScaleLevel'
      discriminator:
        propertyName: type
    ExecutionStrategy:
      type: string
      description: The strategy name derived from `ExecutionDefinition`.
      enum:
        - market
        - limit
        - twap
        - adaptive_twap
        - iceberg
        - chase_limit
        - scale_in
        - scale_out
    ExecutionConstraints:
      type: object
      additionalProperties: false
      description: Per-execution hard constraints; absent key = unconstrained.
      properties:
        maxSlippageBps:
          type: number
        maxSpreadBps:
          type: number
        maxPrice:
          type: number
        minPrice:
          type: number
        maxDurationMs:
          type: number
        makerOnly:
          type: boolean
        allowMarketFallback:
          type: boolean
        cancelIfRiskExceeded:
          type: boolean
        stopIfDisconnected:
          type: boolean
    ExecutionRequest:
      type: object
      additionalProperties: false
      required: [accountId, symbol, marketType, side, intent, entry, sizing, execution]
      description: 'The normalized client intent (PRD §51). Unknown fields are rejected — the contract is closed.'
      properties:
        accountId:
          type: string
        symbol:
          type: string
          description: 'Normalized symbol, e.g. `BTC/USDT`.'
        marketType:
          $ref: '#/components/schemas/MarketType'
        side:
          $ref: '#/components/schemas/Side'
        intent:
          $ref: '#/components/schemas/Intent'
        entry:
          $ref: '#/components/schemas/EntryDefinition'
        stopLoss:
          $ref: '#/components/schemas/PriceDefinition'
        takeProfits:
          type: array
          items:
            $ref: '#/components/schemas/TakeProfitDefinition'
        sizing:
          $ref: '#/components/schemas/SizingDefinition'
        leverage:
          $ref: '#/components/schemas/LeverageDefinition'
        marginMode:
          $ref: '#/components/schemas/MarginMode'
        execution:
          $ref: '#/components/schemas/ExecutionDefinition'
        constraints:
          $ref: '#/components/schemas/ExecutionConstraints'
        riskPolicy:
          $ref: '#/components/schemas/RiskBreachPolicy'
        existingPositionPolicy:
          $ref: '#/components/schemas/ExistingPositionPolicy'
        mode:
          $ref: '#/components/schemas/ExecutionMode'
        targetProfit:
          type: number
          description: 'PRD §14 combined constraint: desired profit bound (quote currency), validated TOGETHER with the risk bound.'
        maxRisk:
          type: number
          description: 'PRD §14 combined constraint: maximum-loss bound (quote currency).'
    # ------------------------------------------------------------------
    # Market context captured at planning time
    # ------------------------------------------------------------------
    LeverageBracket:
      type: object
      additionalProperties: false
      required: [maxNotional, maxLeverage, maintenanceMarginRate]
      properties:
        maxNotional:
          type: number
          nullable: true
          description: Max notional for this tier (inclusive).
        maxLeverage:
          type: number
        maintenanceMarginRate:
          type: number
    InstrumentMetadata:
      type: object
      additionalProperties: false
      required: [symbol, marketType, exchange, baseAsset, quoteAsset, settlementAsset, tickSize, stepSize, minQuantity, maxQuantity, minNotional, maxNotional, contractMultiplier, maxLeverage, maintenanceMarginRate, leverageBrackets]
      description: 'Instrument metadata (PRD §70) — every calculated order is rounded to this.'
      properties:
        symbol:
          type: string
          description: 'Normalized symbol, e.g. `BTC/USDT`.'
        marketType:
          $ref: '#/components/schemas/MarketType'
        exchange:
          $ref: '#/components/schemas/ExchangeId'
        baseAsset:
          type: string
        quoteAsset:
          type: string
        settlementAsset:
          type: string
        tickSize:
          type: number
          description: 'Price tick, e.g. 0.01.'
        stepSize:
          type: number
          description: 'Quantity step, e.g. 0.001.'
        minQuantity:
          type: number
          nullable: true
        maxQuantity:
          type: number
          nullable: true
        minNotional:
          type: number
          nullable: true
        maxNotional:
          type: number
          nullable: true
        contractMultiplier:
          type: number
          description: 'Contract multiplier (linear USDT-M is 1).'
        maxLeverage:
          type: number
          nullable: true
        maintenanceMarginRate:
          type: number
          nullable: true
          description: 'Maintenance margin rate for the approximation (PRD §21); null = unknown.'
        leverageBrackets:
          type: array
          description: 'Leverage tiers, ascending by notional (PRD §18). Empty when unknown.'
          items:
            $ref: '#/components/schemas/LeverageBracket'
    BalanceSnapshot:
      type: object
      additionalProperties: false
      required: [spotAvailable, spotEquity, futuresAvailable, futuresEquity, totalExchangeEquity]
      description: A resolved balance view, as returned by `resolveBalanceBasis`.
      properties:
        spotAvailable:
          type: number
          nullable: true
        spotEquity:
          type: number
          nullable: true
        futuresAvailable:
          type: number
          nullable: true
        futuresEquity:
          type: number
          nullable: true
        totalExchangeEquity:
          type: number
          nullable: true
        assetEquity:
          type: number
          nullable: true
          description: 'Present only for `asset_equity`: the base-asset holding value in quote terms.'
        custom:
          type: number
          nullable: true
          description: 'Present only for `custom`: the caller-supplied reference balance.'
    MarketSnapshot:
      type: object
      additionalProperties: false
      required: [symbol, bid, ask, mid, spreadBps, last, timestamp]
      properties:
        symbol:
          type: string
          description: Normalized symbol.
        bid:
          type: number
        ask:
          type: number
        mid:
          type: number
        spreadBps:
          type: number
        last:
          type: number
        timestamp:
          type: integer
          description: Unix milliseconds.
    FeeModel:
      type: object
      additionalProperties: false
      required: [makerBps, takerBps]
      properties:
        makerBps:
          type: number
          description: 'Basis points of notional, e.g. 5 = 0.05%.'
        takerBps:
          type: number
    SlippageModel:
      type: object
      additionalProperties: false
      required: [slippageBps, safetyReservePct]
      properties:
        slippageBps:
          type: number
          description: 'Estimated slippage in bps of notional, priced into the risk budget.'
        safetyReservePct:
          type: number
          description: 'Safety reserve as a fraction of PRICE RISK (0.01 = 1% of `priceRisk`).'
    ConstraintConflict:
      type: object
      additionalProperties: false
      required: [code, message]
      description: One blocking (or advisory) plan conflict.
      properties:
        code:
          type: string
          description: 'Machine-readable conflict id, e.g. `risk_vs_profit`.'
        message:
          type: string
        detail:
          type: object
          description: 'Human-facing numbers backing the conflict (PRD §14).'
          additionalProperties:
            type: number
    # ------------------------------------------------------------------
    # Plan + preview
    # ------------------------------------------------------------------
    ExecutionPlanRisk:
      type: object
      additionalProperties: false
      required: [budget, estimatedTotalRisk, priceRisk, estimatedFees, slippageBudget, safetyReserve]
      description: 'Risk figures of the plan. Nulls are honest: no stop = no bounded price risk (never faked to 0).'
      properties:
        budget:
          type: number
          nullable: true
          description: 'The user''s risk bound. Null for capital/outcome sizing with no explicit `maxRisk` (PRD §12).'
        estimatedTotalRisk:
          type: number
          nullable: true
          description: 'Stop-based total risk incl. fees/slippage. Null when no stop is configured (PRD §38).'
        priceRisk:
          type: number
          nullable: true
        estimatedFees:
          type: number
          description: Fees are computable regardless of the stop.
        slippageBudget:
          type: number
          description: Slippage allowance charged into the risk figures (a computed model value).
        safetyReserve:
          type: number
          nullable: true
          description: 'Proportional to price risk (PRD §22) — null when no stop.'
    ExecutionPlan:
      type: object
      additionalProperties: false
      required: [venueKey, symbol, marketType, side, intent, quantity, notional, estimatedEntry, stopLoss, takeProfits, risk, leverage, margin, liquidation, execution, instrument, feeModel, slippageModel, balanceSnapshot, marketSnapshot, sizingMode, sizingValue, riskBasis, balanceReference]
      description: 'The execution plan (PRD §56) — immutable creation-time context (PRD §99).'
      properties:
        venueKey:
          $ref: '#/components/schemas/VenueKey'
        symbol:
          type: string
        marketType:
          $ref: '#/components/schemas/MarketType'
        side:
          $ref: '#/components/schemas/Side'
        intent:
          $ref: '#/components/schemas/Intent'
        quantity:
          type: number
        notional:
          type: number
        estimatedEntry:
          type: number
        stopLoss:
          type: number
          nullable: true
        takeProfits:
          type: array
          items:
            $ref: '#/components/schemas/TakeProfitDefinition'
        risk:
          $ref: '#/components/schemas/ExecutionPlanRisk'
        leverage:
          type: object
          additionalProperties: false
          required: [mode, selected]
          properties:
            mode:
              $ref: '#/components/schemas/LeverageMode'
            selected:
              type: number
              nullable: true
        margin:
          type: object
          additionalProperties: false
          required: [estimatedInitial, mode]
          properties:
            estimatedInitial:
              type: number
              nullable: true
            mode:
              $ref: '#/components/schemas/MarginMode'
        liquidation:
          type: object
          additionalProperties: false
          required: [priceApprox, stopToLiquidationBuffer, safe]
          properties:
            priceApprox:
              type: number
              nullable: true
            stopToLiquidationBuffer:
              type: number
              nullable: true
              description: 'Distance from SL to the approximate liquidation price, in quote units.'
            safe:
              type: boolean
              nullable: true
        execution:
          type: object
          additionalProperties: false
          required: [strategy, durationMs, estimatedSlices, urgency]
          properties:
            strategy:
              $ref: '#/components/schemas/ExecutionStrategy'
            durationMs:
              type: number
              nullable: true
            estimatedSlices:
              type: number
              nullable: true
            urgency:
              $ref: '#/components/schemas/ExecutionUrgency'
        instrument:
          $ref: '#/components/schemas/InstrumentMetadata'
        feeModel:
          $ref: '#/components/schemas/FeeModel'
        slippageModel:
          $ref: '#/components/schemas/SlippageModel'
        balanceSnapshot:
          allOf:
            - $ref: '#/components/schemas/BalanceSnapshot'
          nullable: true
          description: 'Null only when the caller had none — never a fabricated snapshot.'
        marketSnapshot:
          allOf:
            - $ref: '#/components/schemas/MarketSnapshot'
          nullable: true
        sizingMode:
          $ref: '#/components/schemas/SizingMode'
        sizingValue:
          type: number
        riskBasis:
          allOf:
            - $ref: '#/components/schemas/BalanceBasis'
          nullable: true
        balanceReference:
          type: number
          nullable: true
    PreviewResult:
      type: object
      additionalProperties: false
      required: [plan, expectedLossAtStop, expectedProfitAtTarget, targetPrice, riskReward, conflicts, warnings, mode]
      description: 'Preview of a planned execution (PRD §80) — nothing was created or sent.'
      properties:
        plan:
          $ref: '#/components/schemas/ExecutionPlan'
        expectedLossAtStop:
          type: number
          nullable: true
          description: 'Loss at the configured stop including fees/slippage. Null = no stop configured.'
        expectedProfitAtTarget:
          type: number
          nullable: true
          description: Net profit at the first/primary TP. Null when no TP.
        targetPrice:
          type: number
          nullable: true
          description: Profit target price used. Null when no TP.
        riskReward:
          type: number
          nullable: true
          description: Risk/reward ratio. Null when not computable.
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintConflict'
        warnings:
          type: array
          items:
            type: string
        mode:
          $ref: '#/components/schemas/ExecutionMode'
    # ------------------------------------------------------------------
    # Persistence shapes (PRD §59–§63): snake_case columns, camelCase objects.
    # ------------------------------------------------------------------
    AccountPermissions:
      type: object
      additionalProperties: false
      required: [read, spotTrade, futuresTrade, withdraw]
      properties:
        read:
          type: boolean
          description: 'Verified by probe: the credential can read account state.'
        spotTrade:
          type: boolean
          nullable: true
          description: 'As REPORTED by the venue''s key-restriction endpoint where one exists; `null` = the venue does not report it — never inferred.'
        futuresTrade:
          type: boolean
          nullable: true
        withdraw:
          type: boolean
          nullable: true
          description: 'MUST be false or null in effect: FUDCourt NEVER requests or uses withdrawal capability (PRD §43). `true` renders as a UI warning.'
    AccountMetadata:
      type: object
      additionalProperties: true
      required: [exchange, label, accountType, permissions, health, apiKeyMasked]
      description: 'Venue probe result for a credential. Masked key only (PRD §109).'
      properties:
        exchange:
          $ref: '#/components/schemas/ExchangeId'
        label:
          type: string
          nullable: true
        accountType:
          type: string
          nullable: true
        permissions:
          $ref: '#/components/schemas/AccountPermissions'
        health:
          $ref: '#/components/schemas/CredentialHealth'
        apiKeyMasked:
          type: string
          nullable: true
          description: 'Partial key display only: `abc...xyz`. NEVER the plaintext key.'
        raw:
          description: Optional venue-specific probe detail (JSON round-trippable).
    CredentialRecord:
      type: object
      additionalProperties: false
      required: [id, userId, exchange, label, apiKeyMasked, permissions, health, createdAt, updatedAt, lastUsedAt, revokedAt]
      description: 'A sealed BYOK credential. Masked only — no route ever returns plaintext secrets (PRD §44, §108, §109).'
      properties:
        id:
          type: string
        userId:
          type: string
        exchange:
          $ref: '#/components/schemas/ExchangeId'
        label:
          type: string
        apiKeyMasked:
          type: string
          description: 'Masked `abc...xyz` only — never the full key (PRD §109).'
        permissions:
          $ref: '#/components/schemas/AccountPermissions'
        health:
          $ref: '#/components/schemas/CredentialHealth'
        createdAt:
          type: integer
          description: Unix milliseconds.
        updatedAt:
          type: integer
        lastUsedAt:
          type: integer
          nullable: true
        revokedAt:
          type: integer
          nullable: true
    ExecutionRecord:
      type: object
      additionalProperties: false
      required: [id, userId, accountId, exchange, symbol, marketType, side, intent, status, mode, sizingMode, sizingValue, riskBudget, riskBasis, entryDefinition, stopDefinition, takeProfitDefinition, executionStrategy, executionConfig, constraints, plannedQuantity, plannedNotional, actualQuantity, actualNotional, averageFillPrice, estimatedFees, actualFees, plannedRisk, currentRisk, strategyState, createdAt, startedAt, completedAt, cancelledAt]
      description: 'One execution (PRD §57, §59).'
      properties:
        id:
          type: string
        userId:
          type: string
        accountId:
          type: string
        exchange:
          $ref: '#/components/schemas/ExchangeId'
        symbol:
          type: string
        marketType:
          $ref: '#/components/schemas/MarketType'
        side:
          $ref: '#/components/schemas/Side'
        intent:
          $ref: '#/components/schemas/Intent'
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        mode:
          $ref: '#/components/schemas/ExecutionMode'
        sizingMode:
          $ref: '#/components/schemas/SizingMode'
        sizingValue:
          type: number
        riskBudget:
          type: number
          nullable: true
        riskBasis:
          allOf:
            - $ref: '#/components/schemas/BalanceBasis'
          nullable: true
        entryDefinition:
          $ref: '#/components/schemas/EntryDefinition'
        stopDefinition:
          allOf:
            - $ref: '#/components/schemas/PriceDefinition'
          nullable: true
        takeProfitDefinition:
          type: array
          items:
            $ref: '#/components/schemas/TakeProfitDefinition'
        executionStrategy:
          $ref: '#/components/schemas/ExecutionStrategy'
        executionConfig:
          $ref: '#/components/schemas/ExecutionDefinition'
        constraints:
          $ref: '#/components/schemas/ExecutionConstraints'
        plannedQuantity:
          type: number
        plannedNotional:
          type: number
        actualQuantity:
          type: number
        actualNotional:
          type: number
        averageFillPrice:
          type: number
          nullable: true
        estimatedFees:
          type: number
          nullable: true
        actualFees:
          type: number
        plannedRisk:
          type: number
          nullable: true
        currentRisk:
          type: number
          nullable: true
        strategyState:
          description: 'Opaque engine state (JSON round-trippable). NOT authoritative across a lost write — the exchange is (PRD §95/§114) — but enough to resume a strategy (PRD §130).'
        createdAt:
          type: integer
        startedAt:
          type: integer
          nullable: true
        completedAt:
          type: integer
          nullable: true
        cancelledAt:
          type: integer
          nullable: true
    ChildOrderRecord:
      type: object
      additionalProperties: false
      required: [id, executionId, exchangeOrderId, clientOrderId, symbol, side, type, price, quantity, filledQuantity, status, isExit, submittedAt, updatedAt, filledAt]
      description: 'One child order (PRD §58, §61).'
      properties:
        id:
          type: string
        executionId:
          type: string
        exchangeOrderId:
          type: string
          nullable: true
        clientOrderId:
          type: string
          description: 'Idempotency id: `fud_{executionId}_{sequence}` (PRD §66).'
        symbol:
          type: string
        side:
          $ref: '#/components/schemas/Side'
        type:
          type: string
          description: 'Venue order type as planned — `market`, `limit`, or `stop_market` (protective-stop leg).'
        price:
          type: number
          nullable: true
        quantity:
          type: number
        filledQuantity:
          type: number
        status:
          $ref: '#/components/schemas/ChildOrderStatus'
        isExit:
          type: boolean
          description: 'True for protective exits (SL/TP) that must survive entry cancellation.'
        submittedAt:
          type: integer
          nullable: true
        updatedAt:
          type: integer
        filledAt:
          type: integer
          nullable: true
    FillRecord:
      type: object
      additionalProperties: false
      required: [id, executionId, childOrderId, exchangeTradeId, price, quantity, quoteQuantity, fee, feeAsset, timestamp]
      description: 'One deduped fill (PRD §62).'
      properties:
        id:
          type: string
        executionId:
          type: string
        childOrderId:
          type: string
          nullable: true
        exchangeTradeId:
          type: string
          description: 'Dedup key part 1 (PRD §62).'
        price:
          type: number
        quantity:
          type: number
        quoteQuantity:
          type: number
        fee:
          type: number
        feeAsset:
          type: string
        timestamp:
          type: integer
    ExecutionEventRecord:
      type: object
      additionalProperties: false
      required: [id, executionId, name, payload, createdAt]
      description: 'One immutable execution event (PRD §63).'
      properties:
        id:
          type: string
        executionId:
          type: string
        name:
          $ref: '#/components/schemas/ExecutionEventName'
        payload:
          type: object
          description: 'Event data as recorded (free-form; additive keys may appear). Never contains secrets.'
          additionalProperties: true
        createdAt:
          type: integer
    RiskProfile:
      type: object
      additionalProperties: false
      required: [defaultRiskMode, defaultRisk, maxRiskPerTradePct, maxOpenRiskPct, maxDailyLossPct, maxLeverage, defaultMarginMode, defaultExecutionUrgency]
      description: 'Account-level safety rules (PRD §72, §88, §119).'
      properties:
        defaultRiskMode:
          type: string
          enum: [risk_usd, risk_percent]
        defaultRisk:
          type: number
        maxRiskPerTradePct:
          type: number
          description: 'Hard cap per trade (percent of the risk basis). Enforced at creation.'
        maxOpenRiskPct:
          type: number
          description: 'Portfolio ceiling on COMMITTED risk (PRD §73). Enforced at creation — a breach is refused, never resized.'
        maxDailyLossPct:
          type: number
          description: 'Daily realized-loss ceiling (PRD §74). Blocks new OPENINGS; closing and reducing stay allowed.'
        maxLeverage:
          type: number
        defaultMarginMode:
          $ref: '#/components/schemas/MarginMode'
        defaultExecutionUrgency:
          $ref: '#/components/schemas/ExecutionUrgency'
    # ------------------------------------------------------------------
    # Request bodies beyond ExecutionRequest
    # ------------------------------------------------------------------
    ConnectAccountInput:
      type: object
      additionalProperties: false
      required: [exchange, label, apiKey, apiSecret]
      description: 'BYOK connect body. Secrets are write-only: no route ever reads them back.'
      properties:
        exchange:
          type: string
        label:
          type: string
        apiKey:
          type: string
          writeOnly: true
        apiSecret:
          type: string
          writeOnly: true
        passphrase:
          type: string
          writeOnly: true
    RiskProfilePatch:
      type: object
      additionalProperties: false
      description: 'Partial profile update; unlisted keys fall back to defaults. Values are validated, never clamped.'
      properties:
        defaultRiskMode:
          type: string
          enum: [risk_usd, risk_percent]
        defaultRisk:
          type: number
        maxRiskPerTradePct:
          type: number
        maxOpenRiskPct:
          type: number
        maxDailyLossPct:
          type: number
        maxLeverage:
          type: number
        defaultMarginMode:
          $ref: '#/components/schemas/MarginMode'
        defaultExecutionUrgency:
          $ref: '#/components/schemas/ExecutionUrgency'
    EmergencyStopInput:
      type: object
      additionalProperties: false
      description: 'Optional scope. Omitted/empty body = everything the caller owns (PRD §75).'
      properties:
        accountId:
          type: string
    # ------------------------------------------------------------------
    # Response envelopes — mirror the route handlers / client.ts exactly.
    # ------------------------------------------------------------------
    PreviewResponse:
      type: object
      additionalProperties: false
      required: [preview, liveEnabled]
      properties:
        preview:
          $ref: '#/components/schemas/PreviewResult'
        liveEnabled:
          type: boolean
          description: 'Server-side kill switch (`FUDCOURT_EXECUTOR_LIVE === ''1''`). Never client-side.'
    CreateExecutionResponse:
      type: object
      additionalProperties: false
      required: [execution, plan]
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionRecord'
        plan:
          $ref: '#/components/schemas/ExecutionPlan'
    LifecycleResponse:
      type: object
      additionalProperties: false
      required: [execution]
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionRecord'
    ExecutionDetailResponse:
      type: object
      additionalProperties: false
      required: [execution, plan]
      properties:
        execution:
          $ref: '#/components/schemas/ExecutionRecord'
        plan:
          allOf:
            - $ref: '#/components/schemas/ExecutionPlan'
          nullable: true
          description: 'Null only for a record with no persisted plan; never faked.'
    ListExecutionsResponse:
      type: object
      additionalProperties: false
      required: [executions]
      properties:
        executions:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionRecord'
    ListOrdersResponse:
      type: object
      additionalProperties: false
      required: [childOrders]
      properties:
        childOrders:
          type: array
          items:
            $ref: '#/components/schemas/ChildOrderRecord'
    ListFillsResponse:
      type: object
      additionalProperties: false
      required: [fills]
      properties:
        fills:
          type: array
          items:
            $ref: '#/components/schemas/FillRecord'
    ListEventsResponse:
      type: object
      additionalProperties: false
      required: [events]
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/ExecutionEventRecord'
    ListAccountsResponse:
      type: object
      additionalProperties: false
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/CredentialRecord'
    AccountResponse:
      type: object
      additionalProperties: false
      required: [account, metadata]
      description: Connect, test and get all answer the sealed record and the venue's probe result.
      properties:
        account:
          $ref: '#/components/schemas/CredentialRecord'
        metadata:
          $ref: '#/components/schemas/AccountMetadata'
    DeleteAccountResponse:
      type: object
      additionalProperties: false
      required: [ok]
      properties:
        ok:
          type: boolean
          enum: [true]
    SettingsResponse:
      type: object
      additionalProperties: false
      required: [profile]
      properties:
        profile:
          $ref: '#/components/schemas/RiskProfile'
    EmergencyStopResponse:
      type: object
      additionalProperties: false
      required: [stopped, cancelledOrders]
      properties:
        stopped:
          type: number
          description: Managed strategies stopped.
        cancelledOrders:
          type: number
          description: Managed open orders cancelled. Positions are never touched.
    # ------------------------------------------------------------------
    # Error shapes — the routes answer with these verbatim bodies.
    # The normalized cross-service error model (code/message/request_id) is
    # shared/contracts/schemas/error-envelope.json.
    # ------------------------------------------------------------------
    ErrorBasic:
      type: object
      additionalProperties: true
      required: [error]
      description: 'Minimal route error — e.g. `{"error": "invalid JSON body"}` or `{"error": "account not found"}`.'
      properties:
        error:
          type: string
          description: The server's own error text; display verbatim.
    ErrorDetail:
      type: object
      additionalProperties: true
      required: [error, detail]
      description: 'Error with a specific reason — e.g. `{"error": "invalid transition", "detail": "..."}` or `{"error": "credential check failed", "detail": "...", "category": "..."}`. Extra numeric fields may carry the numbers behind a refusal (PRD §73/§74).'
      properties:
        error:
          type: string
        detail:
          type: string
        category:
          $ref: '#/components/schemas/ErrorCategory'
    ValidationError:
      type: object
      additionalProperties: true
      required: [error, errors]
      description: 'Field-named validation errors — `{"error": "validation", "errors": ["symbol: ...", ...]}`.'
      properties:
        error:
          type: string
          enum: [validation]
        errors:
          type: array
          items:
            type: string
    ConflictError:
      type: object
      additionalProperties: true
      required: [error, conflicts, preview]
      description: 'A conflicting plan is refused, never created (§117) — `{"error": "conflict", "conflicts": [...], "preview": {...}}`. Conflicts name real fields; show them verbatim.'
      properties:
        error:
          type: string
          enum: [conflict]
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintConflict'
        preview:
          $ref: '#/components/schemas/PreviewResult'
    # ------------------------------------------------------------------
    # App-surface error shapes (real route bodies, not the normalized model;
    # that lives in shared/contracts/schemas/error-envelope.json).
    # ------------------------------------------------------------------
    FailError:
      type: object
      additionalProperties: true
      required: [error]
      description: 'The `fail()` helper body — `{"error": "<text>"}` with `detail` when the helper was given one. Display `error` verbatim.'
      properties:
        error:
          type: string
        detail:
          type: string
    SidecarError:
      type: object
      additionalProperties: true
      required: [error]
      description: |
        Any research-proxy or sidecar refusal: `{"error": "<real text>", ...}`.
        The extra keys are the failing branch's own evidence (mode, key, limit,
        upstream, upstreamStatus, detail, kind) and vary per branch; the fields
        below are the observed ones and others may appear.
      properties:
        error:
          type: string
        detail:
          type: string
        mode:
          type: string
        key:
          type: string
          nullable: true
        limit:
          type: string
        kind:
          type: string
          nullable: true
        upstream:
          type: string
        upstreamStatus:
          type: integer
          nullable: true
    # ------------------------------------------------------------------
    # Research read proxies — verbatim sidecar wire shapes
    # (backend/data/internal/{cryptorank,khala,llama,chainrank,news}).
    # Every *float64 pointer emits JSON null when unknown (honest nulls,
    # never 0); every `omitempty` key is simply absent when unset.
    # ------------------------------------------------------------------
    CrEnvelope:
      type: object
      additionalProperties: false
      required: [kind, upstream, fetchedAt, cache, count]
      description: |
        The CryptoRank envelope: the five always-present keys plus the mode's
        own section(s) — only the relevant ones are emitted per mode.
        `fetchedAt` is unix seconds. Go bodies end in one trailing newline and
        use struct key order (field-compatible, not byte-identical).
      properties:
        kind:
          type: string
          description: Echo of the requested mode.
        upstream:
          type: string
          description: The upstream URL actually fetched.
        dataRoute:
          type: string
          nullable: true
          description: Which data route produced the payload (present on some modes).
        fetchedAt:
          type: integer
          format: int64
          description: Unix seconds.
        cache:
          type: string
          enum: [MISS, HIT]
        count:
          type: integer
          description: Number of rows/items in the mode's main section.
        upstreamTotal:
          type: number
          nullable: true
          description: Pre-slice upstream row count when the mode slices.
        slice:
          type: string
          nullable: true
          description: Human-readable slice semantics note (rendered verbatim by the board).
        changeSource:
          type: string
          nullable: true
          enum: [direct, derived-from-histPrices-24H, unavailable]
        anchor24h:
          $ref: '#/components/schemas/AnchorCount'
        anchor7d:
          $ref: '#/components/schemas/AnchorCount'
        global:
          $ref: '#/components/schemas/CrGlobal'
        fundingRounds:
          type: array
          items:
            $ref: '#/components/schemas/CrFundingRound'
        upcomingIco:
          type: array
          items:
            $ref: '#/components/schemas/CrUpcomingIco'
        category:
          $ref: '#/components/schemas/CrCategoryInfo'
        tagRows:
          type: array
          items:
            $ref: '#/components/schemas/CrTagRow'
        tag:
          $ref: '#/components/schemas/CrTagInfo'
        detail:
          $ref: '#/components/schemas/CrCoinDetail'
        chain:
          $ref: '#/components/schemas/CrChainInfo'
        chainRows:
          type: array
          items:
            $ref: '#/components/schemas/CrChainRow'
        listings:
          $ref: '#/components/schemas/CrListings'
        launchpoolRows:
          type: array
          items:
            $ref: '#/components/schemas/CrLaunchpoolRow'
        nodesaleRows:
          type: array
          items:
            $ref: '#/components/schemas/CrNodeSaleRow'
        ecosystemRows:
          type: array
          items:
            $ref: '#/components/schemas/CrEcosystemRow'
        ecosystem:
          $ref: '#/components/schemas/CrEcosystemInfo'
        rwaRows:
          type: array
          items:
            $ref: '#/components/schemas/CrRwaRow'
        rwaAsset:
          $ref: '#/components/schemas/CrRwaAsset'
        quarterlyBtc:
          type: array
          items:
            $ref: '#/components/schemas/CrQuarterlyYear'
        quarterlyEth:
          type: array
          items:
            $ref: '#/components/schemas/CrQuarterlyYear'
        prediction:
          $ref: '#/components/schemas/CrPredictionAgg'
        predictionRows:
          type: array
          items:
            $ref: '#/components/schemas/CrPredictionRow'
        newsRows:
          type: array
          items:
            $ref: '#/components/schemas/CrNewsRow'
        converterRows:
          type: array
          items:
            $ref: '#/components/schemas/CrConverterRow'
        mediaRows:
          type: array
          items:
            $ref: '#/components/schemas/CrMediaRow'
        relatedTags:
          type: array
          items:
            $ref: '#/components/schemas/CrRelatedTag'
        aiOverview:
          $ref: '#/components/schemas/CrAiOverview'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/CrRow'
    CrRow:
      description: |
        A union of the five home/coins/trending/gainers/losers row shapes.
