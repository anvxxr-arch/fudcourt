openapi: 3.0.3
info:
  title: FUDCourt Executor API
  version: 0.1.0
  description: |
    The **executor HTTP surface** of FUDCourt as it exists TODAY.

    This contract documents the CURRENT TS-owned surface during the Go
    migration: the ground truth is the frozen contract in
    `frontend/web/src/platform/executor/types.ts` and the route handlers under
    `frontend/web/src/app/**/api/executor/**` (endpoint list mirrored from the
    header of `frontend/web/src/features/executor/client.ts`). It is **the
    compatibility contract for `backend/api` + `backend/workers/executor` +
    `shared/sdk/typescript`**: the Go services being built MUST preserve these
    methods, paths, and response envelopes, and `shared/sdk/typescript` generates its
    types from this file.

    House rules encoded here (PRD §108, §109, house style):

    * **Unknown fields are forbidden to be added by consumers.** Request bodies
      are closed (`additionalProperties: false`); do not extend this contract
      ad hoc — extend this document and regenerate the SDK.
    * **Honest nulls**: fields that may be unknown are `nullable`, never
      faked to `0`.
    * **Credentials are write-only**: secrets are accepted once at connect
      time, sealed server-side, and no route ever returns them. Only masked
      keys (`abc...xyz`) leave the server.
    * Error bodies keep the server's own text (`error`, `detail`, `errors`) —
      clients display `err.message` verbatim.

    Lifecycle semantics worth knowing: `POST /api/executor/executions/{id}/cancel`
    cancels open orders and NEVER closes a position; `mode: 'preview'` is a dry
    run that creates nothing and cannot be used to create an execution; LIVE
    mode is fail-closed behind the server-side kill switch
    (`FUDCOURT_EXECUTOR_LIVE=1`).
  license:
    name: UNLICENSED
servers:
  - url: /
    description: Same-origin (Next.js route handlers).
tags:
  - name: executions
    description: Preview, create, inspect and steer executions.
  - name: accounts
    description: BYOK exchange credentials (masked-only read surface).
  - name: settings
    description: The user's risk profile.
  - name: emergency
    description: Emergency stop (no TS client function yet; a real route handler).
paths:
  /api/executor/preview:
    post:
      tags: [executions]
      operationId: preview
      summary: Dry run — nothing is created, nothing is sent (PRD §80, §98)
      description: |
        Plans the execution against live venue data (instrument, market, fees,
        balances) and returns the preview with conflicts and warnings. Plan
        conflicts are reported INSIDE the 200 preview (`preview.conflicts`);
        they are not an error at preview time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '200':
          description: The preview, plus the server-side live-trading kill switch state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewResponse'
        '400':
          description: "Invalid JSON body, request shape, or unresolvable sizing (`error: 'validation'` carries field-named `errors`)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ErrorBasic'
                  - $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Account unusable (`credential not healthy`) or blocked by position policy (`opposing position exists`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /api/executor/executions:
    post:
      tags: [executions]
      operationId: createExecution
      summary: Create an execution with an immutable input snapshot (PRD §99)
      description: |
        Validates and plans the request, then persists the execution and its
        immutable creation-time plan. A conflicting plan is **never created**:
        the route answers `409 { error: 'conflict', conflicts, preview }` so the
        caller can show the planner's blocking reasons verbatim. Portfolio
        gates (§73 open risk, §74 daily loss) refuse with `409` before any row
        exists. `mode: 'preview'` is refused — use `POST /api/executor/preview`.
        LIVE mode requires the server-side kill switch (`403` otherwise).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecutionRequest'
      responses:
        '200':
          description: The created record and its immutable creation-time plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateExecutionResponse'
        '400':
          description: "Invalid JSON body / request shape (`error: 'validation'`), or `invalid mode`."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ErrorBasic'
                  - $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Live trading disabled (kill switch is off).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            Plan conflict (the planner's blocking reasons + the preview),
            portfolio-gate refusal (`daily loss guard reached`,
            `max open risk exceeded` — with the numbers that produced the
            refusal as extra fields), unhealthy credential, or an
            existing-position policy refusal.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ConflictError'
                  - $ref: '#/components/schemas/ErrorDetail'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
    get:
      tags: [executions]
      operationId: listExecutions
      summary: Execution history for the session user (PRD §22, §97)
      parameters:
        - name: status
          in: query
          required: false
          description: Optional lifecycle filter; an unknown value is a 400, never silently ignored.
          schema:
            $ref: '#/components/schemas/ExecutionStatus'
      responses:
        '200':
          description: Executions, newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExecutionsResponse'
        '400':
          description: "Unknown `status` value (`{ error: 'status', detail }`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/executor/executions/{id}:
    get:
      tags: [executions]
      operationId: getExecution
      summary: One execution and the plan it was created from
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: The record plus its plan (null only when no plan was persisted — never faked).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExecutionDetailResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/executor/executions/{id}/start:
    post:
      tags: [executions]
      operationId: startExecution
      summary: Lifecycle intent — start (READY → RUNNING, PRD §57)
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Lifecycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/executor/executions/{id}/pause:
    post:
      tags: [executions]
      operationId: pauseExecution
      summary: Lifecycle intent — pause (RUNNING → PAUSED)
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Lifecycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/executor/executions/{id}/resume:
    post:
      tags: [executions]
      operationId: resumeExecution
      summary: Lifecycle intent — resume (PAUSED → RUNNING)
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Lifecycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/executor/executions/{id}/cancel:
    post:
      tags: [executions]
      operationId: cancelExecution
      summary: Lifecycle intent — cancel open orders; positions are NEVER closed
      description: |
        Cancels managed open orders (READY/DRAFT cancel outright; a running
        execution moves through CANCEL_REQUESTED). Closing a position is a
        separate explicit action, never implied here.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          $ref: '#/components/responses/Lifecycle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'
  /api/executor/executions/{id}/orders:
    get:
      tags: [executions]
      operationId: listOrders
      summary: Child orders of an execution (PRD §61)
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Child orders, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListOrdersResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/executor/executions/{id}/fills:
    get:
      tags: [executions]
      operationId: listFills
      summary: Deduped fill history of an execution (PRD §62)
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Fills, deduped on (exchangeTradeId).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFillsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/executor/executions/{id}/events:
    get:
      tags: [executions]
      operationId: listEvents
      summary: Immutable event log of an execution (PRD §63)
      description: |
        Event names are the frozen `ExecutionEventName` enum; the canonical
        cross-service event catalog (stable ids + aliases) lives in
        `shared/contracts/events/catalog.json`.
      parameters:
        - $ref: '#/components/parameters/ExecutionId'
      responses:
        '200':
          description: Events, oldest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListEventsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/executor/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Connected accounts — masked keys only (PRD §87, §109)
      responses:
        '200':
          description: Credential records (secrets are never returned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAccountsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [accounts]
      operationId: connectAccount
      summary: BYOK connect — secrets are write-only, sealed server-side
      description: |
        `apiKey`/`apiSecret`/`passphrase` are accepted once here and never
        returned by any route. The live venue probe runs at connect time; a key
        that grants withdrawal permission is refused (400).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAccountInput'
      responses:
        '200':
          description: The sealed record (masked key) and the venue's probe metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: Invalid body, or `withdrawal permission not supported` / validation errors.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ErrorBasic'
                  - $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /api/executor/accounts/{id}:
    get:
      tags: [accounts]
      operationId: getAccount
      summary: One connected account — masked key only
      description: |
        Present as a route handler today with no `client.ts` function yet; kept
        in the contract so the Go migration preserves it.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The sealed record (masked key) and the venue's probe metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [accounts]
      operationId: deleteAccount
      summary: Revoke a credential (secrets destroyed; record kept masked)
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteAccountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/executor/accounts/{id}/test:
    post:
      tags: [accounts]
      operationId: testAccount
      summary: Live credential validation (PRD §46)
      description: |
        Re-probes the venue with the sealed credential and refreshes its
        health. A failing probe answers `502 { error: 'credential check
        failed', detail, category }` — the health is still updated.
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: The sealed record (masked key) and fresh probe metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountResponse'
        '400':
          description: "`withdrawal permission not supported`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/UpstreamFailure'
  /api/executor/settings:
    get:
      tags: [settings]
      operationId: getSettings
      summary: The user's risk profile (PRD §88)
      responses:
        '200':
          description: The effective profile (defaults filled in server-side).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags: [settings]
      operationId: putSettings
      summary: Partial profile update — unlisted keys fall back to defaults
      description: |
        Strict validation: values are checked, never clamped (a negative
        `maxLeverage` is a 400 with field-named `errors`, not a silently
        corrected write).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskProfilePatch'
      responses:
        '200':
          description: The full stored profile after the merge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsResponse'
        '400':
          description: "Invalid JSON body or invalid values (`error: 'validation'`, field-named `errors`)."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationError'
                  - $ref: '#/components/schemas/ErrorBasic'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/executor/emergency:
    post:
      tags: [emergency]
      operationId: emergencyStop
      summary: Emergency stop — stop managed strategies, cancel managed orders
      description: |
        PRD §75: stops all managed strategies and cancels managed open orders
        for the caller (optionally one account). Positions are NEVER closed
        here. Present as a route handler today with no `client.ts` function
        yet; kept in the contract so the Go migration preserves it. An empty
        body means "everything I own".
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyStopInput'
      responses:
        '200':
          description: How many strategies were stopped and orders cancelled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmergencyStopResponse'
        '400':
          description: "`accountId` present but not a string (`error: 'validation'`)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  # ==========================================================================
  # Treasury read model + CRUD (frontend/web/src/app/(frontend)/api/**)
  # ==========================================================================
  /api/all:
    get:
      tags: [data]
      operationId: getAll
      summary: Everything the dashboard reads, in one call
      description: |
        Runs the eight `DASHBOARD_READS` queries in parallel via
        `platform/db/client.ts` `getAll()` against the local Postgres read model
        (DR-019) and returns their row arrays plus the board constants.
        Requires the `team` tier (middleware).
      responses:
        '200':
          description: Row arrays per dashboard table plus board constants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
  /api/coins:
    get:
      tags: [data]
      operationId: listCoins
      summary: Distinct coins with total value, sorted by value desc
      description: |
        `SELECT asset, SUM(value_usd), SUM(quantity), COUNT(DISTINCT chain),
        COUNT(DISTINCT wallet) FROM assets GROUP BY asset` plus the portfolio
        total. Requires the `team` tier (middleware).
      responses:
        '200':
          description: Coin rows (string-typed aggregates — the rows are unvalidated at the boundary) and the total.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoinsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
  /api/wallets:
    get:
      tags: [data]
      operationId: listWallets
      summary: All wallet rows (`SELECT * FROM wallets`)
      description: Requires the `team` tier (middleware). Rows carry the full wallets table columns.
      responses:
        '200':
          description: Wallet rows.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WalletRow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
    post:
      tags: [data]
      operationId: updateWallet
      summary: Update a wallet's display fields (address identifies the row)
      description: |
        Despite being a POST this is an UPDATE: `address` is required and
        identifies the row; at least one of `alias`/`emoji`/`color`/`notes`
        must be present. Requires the `team` tier AND `requireMutationAuth`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletUpdateInput'
      responses:
        '200':
          description: The updated wallet row (`{}` when the row does not exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletRow'
        '400':
          description: "`{\"error\": \"address required\"}` or `{\"error\": \"nothing to update\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
        '401':
          $ref: '#/components/responses/MutationUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
  /api/transactions:
    get:
      tags: [data]
      operationId: listTransactions
      summary: Filtered, paginated transactions
      description: |
        `limit`/`offset` are parsed with `parseInt` (non-numeric falls back to
        the default — this legacy route does not refuse). `search` is a LIKE
        over memo/event/hash/wallet_to. Requires the `team` tier (middleware).
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100 }, description: 'Page size (parseInt; default 100).' }
        - { name: offset, in: query, schema: { type: integer, default: 0 }, description: 'Row offset (parseInt; default 0).' }
        - { name: search, in: query, schema: { type: string }, description: 'LIKE filter over memo, event, hash, wallet_to.' }
        - { name: chain, in: query, schema: { type: string }, description: 'Exact chain match.' }
        - { name: venue, in: query, schema: { type: string }, description: 'Exact venue_id match.' }
        - { name: direction, in: query, schema: { type: string }, description: 'Exact direction match (e.g. IN/OUT).' }
        - { name: from, in: query, schema: { type: string }, description: 'date >= value.' }
        - { name: to, in: query, schema: { type: string }, description: 'date <= value.' }
      responses:
        '200':
          description: Rows plus the filter echoes and the total count with the same filters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
    post:
      tags: [data]
      operationId: createTransactions
      summary: Insert one transaction or a bulk batch
      description: |
        Bulk when `{"bulk": true, "transactions": [...]}`; otherwise a single
        row. `date` and `event` are required on the single path. `amount_usd`
        is `parseFloat(...) || 0`; missing `direction` defaults to IN/OUT by
        the sign. Requires `requireMutationAuth` (team).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/TransactionCreateInput'
                - $ref: '#/components/schemas/TransactionBulkInput'
      responses:
        '200':
          description: The inserted row (single) or `{inserted, transactions}` (bulk).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TransactionRow'
                  - $ref: '#/components/schemas/TransactionBulkInsertResponse'
        '400':
          description: "`{\"error\": \"date and event required\"}` — the single-row path; bulk rows are inserted as given (event is required in practice but not validated)."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
        '401':
          $ref: '#/components/responses/MutationUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
    put:
      tags: [data]
      operationId: bulkUpdateTransactions
      summary: Bulk update transactions by id
      description: Requires `requireMutationAuth` (team). Only listed fields are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionBulkUpdateInput'
      responses:
        '200':
          description: "`{\"updated\": true, \"count\": <ids.length>}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkUpdateResponse'
        '400':
          description: "`{\"error\": \"ids array required\"}` or `{\"error\": \"nothing to update\"}`."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
        '401':
          $ref: '#/components/responses/MutationUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
    delete:
      tags: [data]
      operationId: bulkDeleteTransactions
      summary: Bulk delete transactions by id
