[package]
name = "fudcourt-discord-worker"
version = "0.1.0"
edition = "2021"
description = "fudcourt Discord worker: the durable job runtime (apps/discord-worker) — transactional claiming over PostgreSQL, retry with backoff, database-enforced idempotency, an optional Valkey advisory lock, and graceful shutdown"

# Single crate, no workspace, matching apps/reconciler. The durability lives in
# PostgreSQL (schemas/pg-schema.sql: `jobs`, `job_runs`); Valkey is an optional
# advisory layer, never the system of record.
[lib]
name = "fudcourt_discord_worker"
path = "src/lib.rs"

[[bin]]
name = "discord-worker"
path = "src/main.rs"

[dependencies]
# `signal` drives the graceful-shutdown path; `sync` is the connection pool and
# the in-flight task set; `time` is the backoff sleep and the poll interval.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "signal", "sync"] }
# The system of record is local Postgres over loopback, so `NoTls` (DR-040).
# `with-serde_json-1` is what maps `jsonb` <-> `serde_json::Value`; it is not a
# default feature.
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-chrono-0_4"] }

# Scheduling. `chrono` + `chrono-tz` because every schedule carries an EXPLICIT
# timezone (the footer of §20 of the brief) and DST has to be resolved at the
# boundary, not guessed; `cron` parses the expression only, it has no notion of a
# zone, so the cron path is resolved by mapping local wall-clock through the zone
# (see `scheduler::schedule::resolve_local`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
cron = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Optional advisory lock only: `VALKEY_URL` unset means the lock is a no-op and
# Postgres alone provides correctness. `script` is for the compare-and-delete
# release (a plain DEL could delete another worker's lock).
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "script"] }

# Feeds (phase 11). `reqwest` with rustls and NO default features: the default
# feature set would pull native-tls/openssl, and this worker only ever speaks
# HTTPS to two places. `gzip` is not a nicety — most feeds serve compressed
# bodies and a client that does not ask will be handed one anyway.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
# One parser for RSS 2.0/1.0, Atom and JSON Feed rather than three hand-rolled
# ones; it is the adapter layer's whole job.
feed-rs = "2.4"
# CIDR matching for the SSRF guard. Hand-rolling `a.b.c.d/x` comparisons is how
# the `172.16/12` and `::ffff:` cases get missed.
ipnet = "2.12"
# Percent-decoding and host normalization in the guard: `http://127.1`, `%31%32%37.0.0.1`
# and `http://[::ffff:127.0.0.1]` must all land on the same rejected address.
url = "2"
# A stable digest for the item key. `DefaultHasher` is SipHash with
# implementation-defined keys: it is NOT guaranteed stable across Rust versions,
# and this digest is PERSISTED — a changed hash silently re-announces every item.
sha2 = "0.10"

[profile.release]
strip = true
