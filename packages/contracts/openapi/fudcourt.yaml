    CrMediaRow:
      type: object
      additionalProperties: false
      required: [id, title, tags]
      properties:
        id: { type: string }
        title: { type: string }
        channelTitle: { type: string, nullable: true }
        publishedAt: { type: string, nullable: true }
        durationSeconds: { type: number, nullable: true }
        tags:
          type: array
          items: { type: string }
    CrAiOverview:
      type: object
      additionalProperties: false
      required: [market, news, funding, dropHunting, vesting]
      properties:
        market:
          $ref: '#/components/schemas/AiMarket'
        news:
          type: array
          items:
            $ref: '#/components/schemas/AiNews'
        funding:
          $ref: '#/components/schemas/AiFunding'
        dropHunting:
          $ref: '#/components/schemas/AiDropHunting'
        vesting:
          $ref: '#/components/schemas/AiVesting'
    AiMarket:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, nullable: true }
        updatedAt: { type: string, nullable: true }
    AiNews:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        id: { type: number, nullable: true }
        title: { type: string }
        date: { type: string, nullable: true }
        isBullish: { type: boolean, nullable: true }
    AiFundingRound:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        key: { type: string, nullable: true }
        name: { type: string }
        stage: { type: string, nullable: true }
        raisedUsd: { type: number, nullable: true }
    AiFunding:
      type: object
      additionalProperties: false
      required: [rounds]
      properties:
        summary: { type: string, nullable: true }
        rounds:
          type: array
          items:
            $ref: '#/components/schemas/AiFundingRound'
    AiActivity:
      type: object
      additionalProperties: false
      required: [key]
      properties:
        key: { type: string }
        type: { type: string, nullable: true }
        coinName: { type: string, nullable: true }
    AiDropHunting:
      type: object
      additionalProperties: false
      required: [activities]
      properties:
        summary: { type: string, nullable: true }
        activities:
          type: array
          items:
            $ref: '#/components/schemas/AiActivity'
    AiUnlock:
      type: object
      additionalProperties: false
      properties:
        date: { type: string, nullable: true }
        unlockPercent: { type: number, nullable: true }
        coinName: { type: string, nullable: true }
    AiVesting:
      type: object
      additionalProperties: false
      required: [unlocks]
      properties:
        summary: { type: string, nullable: true }
        unlocks:
          type: array
          items:
            $ref: '#/components/schemas/AiUnlock'
    CrCategoryInfo:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
        gainers: { type: number, nullable: true }
        losers: { type: number, nullable: true }
    AnchorCount:
      type: object
      additionalProperties: false
      required: [recentlyAdded, mostSearched, mostVisited]
      properties:
        recentlyAdded: { type: integer }
        mostSearched: { type: integer }
        mostVisited: { type: integer }
    CrListings:
      type: object
      additionalProperties: false
      required: [recentlyAdded, mostSearched, mostVisited]
      properties:
        recentlyAdded:
          type: array
          items:
            $ref: '#/components/schemas/CrListingCoin'
        mostSearched:
          type: array
          items:
            $ref: '#/components/schemas/CrListingCoin'
        mostVisited:
          type: array
          items:
            $ref: '#/components/schemas/CrListingCoin'
    CrRelatedTag:
      type: object
      additionalProperties: false
      required: [slug, name]
      properties:
        slug: { type: string }
        name: { type: string }
    # ------------------------------------------------------------------
    # khala.io (structured blocks — no HTML ever crosses this boundary)
    # ------------------------------------------------------------------
    KhEnvelope:
      type: object
      additionalProperties: false
      required: [kind, upstream, fetchedAt, cache, count]
      description: "The khala envelope. `report` (mode=report) or `rows` (reports/latest) is present per mode; `slice` is the sidecar's own prose note, rendered verbatim. `fetchedAt` is unix seconds."
      properties:
        kind:
          type: string
          enum: [reports, report, latest]
        upstream:
          type: string
        fetchedAt:
          type: integer
          format: int64
        cache:
          type: string
          enum: [MISS, HIT]
        count:
          type: integer
        upstreamTotal:
          type: integer
          nullable: true
        slice:
          type: string
          nullable: true
        missingSlugs:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            $ref: '#/components/schemas/KhRow'
        report:
          $ref: '#/components/schemas/KhReport'
    KhRow:
      type: object
      additionalProperties: false
      required: [position, slug, url, title, summary]
      properties:
        position: { type: integer }
        slug: { type: string }
        url: { type: string }
        title: { type: string }
        summary: { type: string }
        published: { type: string, nullable: true }
        publishedISO: { type: string, nullable: true }
    KhReport:
      type: object
      additionalProperties: false
      required: [slug, url, title, metaTitle, authors, sections, body]
      properties:
        slug: { type: string }
        url: { type: string }
        title: { type: string }
        metaTitle: { type: string }
        published: { type: string, nullable: true }
        publishedISO: { type: string, nullable: true }
        authors:
          type: array
          nullable: true
          description: 'Null (not omitted) when the report has no matched author.'
          items:
            $ref: '#/components/schemas/KhAuthor'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/KhSection'
        body:
          type: array
          description: 'The article as structured blocks — `{type: h2|h3|h4|p|li, text}` with inline emphasis flattened to text. Never HTML.'
          items:
            $ref: '#/components/schemas/KhBlock'
    KhAuthor:
      type: object
      additionalProperties: false
      required: [name, url]
      properties:
        name: { type: string }
        url: { type: string }
    KhSection:
      type: object
      additionalProperties: false
      required: [level, title]
      properties:
        id: { type: string, nullable: true }
        level: { type: integer }
        title: { type: string }
    KhBlock:
      type: object
      additionalProperties: false
      required: [type, text]
      properties:
        type:
          type: string
          enum: [h2, h3, h4, p, li]
        id: { type: string, nullable: true }
        text: { type: string }
    # ------------------------------------------------------------------
    # DeFiLlama (rows passed through; upstream may add fields)
    # ------------------------------------------------------------------
    LlamaEnvelope:
      type: object
      additionalProperties: true
      required: [kind, rows, upstream, fetchedAt, upstreamTotal, derived]
      description: "`{kind, rows, upstream, fetchedAt, upstreamTotal, derived}`; `cache` is header-only (`X-Cache`), never in the body. Row shapes: chains = `{name, tvl, tokenSymbol?, gecko_id?, chainId?}`; protocols = `{name, slug, category, tvl, change_1d, change_7d, mcap, chains, url, logo}` (nullable-any passthrough); historical = `{date, tvl}`."
      properties:
        kind:
          type: string
          enum: [chains, protocols, historical]
        rows:
          type: array
          description: The upstream rows, resorted per mode; upstream-defined shape.
          items:
            type: object
            additionalProperties: true
        upstream: { type: string }
        fetchedAt:
          type: integer
          format: int64
          description: Unix seconds.
        upstreamTotal: { type: integer }
        derived: { type: string }
    # ------------------------------------------------------------------
    # chainrank (upstream body spread first, then our labels)
    # ------------------------------------------------------------------
    ChainrankStatsEnvelope:
      type: object
      additionalProperties: true
      required: [kind, upstream, fetchedAt, online, totalClicks, listings, totalUsdCents, topUsdCents, claimTopCents]
      description: "`stats` mode: upstream's verified numeric fields (shape-checked before serving) spread through, plus `kind`, `upstream`, `fetchedAt`. Upstream may carry additional fields — they pass through untouched."
      properties:
        kind: { type: string, enum: [stats] }
        upstream: { type: string }
        fetchedAt:
          type: integer
          format: int64
          description: Unix seconds.
        online: { type: number }
        totalClicks: { type: number }
        listings: { type: number }
        totalUsdCents: { type: number }
        topUsdCents: { type: number }
        claimTopCents: { type: number }
    ChainrankListingsEnvelope:
      type: object
      additionalProperties: true
      required: [kind, upstream, fetchedAt, rows]
      description: "`listings` mode: upstream's `rows` array (upstream-defined row shape — projected nowhere, the board renders what upstream sent) spread through, plus `kind`, `upstream`, `fetchedAt`."
      properties:
        kind: { type: string, enum: [listings] }
        upstream: { type: string }
        fetchedAt:
          type: integer
          format: int64
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
    # ------------------------------------------------------------------
    # Cointelegraph RSS
    # ------------------------------------------------------------------
    NewsEnvelope:
      type: object
      additionalProperties: false
      required: [items, total, upstream, timestamp]
      description: "`items` is the `limit` head; `total` is the FULL parsed count (the two differ by design). `timestamp` is unix ms."
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
        total: { type: integer }
        upstream: { type: string }
        timestamp:
          type: integer
          format: int64
          description: Unix milliseconds.
    NewsItem:
      type: object
      additionalProperties: false
      required: [title, link, description, pubDate, image, source]
      description: Six strings, always present (empty string when the RSS item lacks the field — the parser's own normalization).
      properties:
        title: { type: string }
        link: { type: string }
        description: { type: string }
        pubDate: { type: string }
        image: { type: string }
        source: { type: string }
    # ------------------------------------------------------------------
    # Reconciliation (Rust service, forwarded verbatim)
    # ------------------------------------------------------------------
    ReconcileResponse:
      type: object
      additionalProperties: false
      required: [rows, wallets, walletSummary, source]
      description: "`rows` sorted by biggest |diff| first. `walletSummary` is keyed by wallet name and built in row insertion order (sorted-rows order). `current_total` counts only the stablecoin legs (USDC/USDT) while `expected_total`/`diff_total` count every leg — the route's own quirk, kept."
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ReconRow'
        wallets:
          type: array
          description: 'Wallet rows (`SELECT address, label, alias, emoji, color, chain FROM wallets ORDER BY label`), passed through as objects.'
          items:
            $ref: '#/components/schemas/ReconcileWalletRow'
        walletSummary:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/WalletSummaryTotals'
        source:
          type: string
          description: 'Names the implementation that produced the numbers (e.g. `rust`), so a reader can tell the Rust service''s answer from the TS oracle''s during the parallel run.'
    ReconRow:
      type: object
      additionalProperties: false
      required: [wallet, asset, current, in_sum, out_sum, expected, diff]
      properties:
        wallet: { type: string }
        asset: { type: string }
        current: { type: number }
        in_sum: { type: number }
        out_sum: { type: number }
        expected: { type: number }
        diff:
          type: number
          description: 'current − expected (per asset).'
    ReconcileWalletRow:
      type: object
      additionalProperties: true
      required: [address, chain]
      description: A wallets-table row as stored; nullable display columns pass through as JSON null.
      properties:
        address: { type: string }
        label: { type: string, nullable: true }
        alias: { type: string, nullable: true }
        emoji: { type: string, nullable: true }
        color: { type: string, nullable: true }
        chain: { type: string }
    WalletSummaryTotals:
      type: object
      additionalProperties: false
      required: [current_total, expected_total, diff_total]
      properties:
        current_total: { type: number }
        expected_total: { type: number }
        diff_total: { type: number }
