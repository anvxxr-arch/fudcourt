          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
        '401':
          $ref: '#/components/responses/MutationUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: 'Query failure — `{"error": "<message>"}`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBasic'
    patch:
      tags: [data]
      operationId: patchTransaction
