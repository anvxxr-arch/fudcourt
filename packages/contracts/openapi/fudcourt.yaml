    # ------------------------------------------------------------------
    # Error shapes — the routes answer with these verbatim bodies.
    # The normalized cross-service error model (code/message/request_id) is
    # packages/contracts/schemas/error-envelope.json.
    # ------------------------------------------------------------------
    ErrorBasic:
      type: object
      additionalProperties: true
      required: [error]
      description: 'Minimal route error — e.g. `{"error": "invalid JSON body"}` or `{"error": "account not found"}`.'
      properties:
        error:
          type: string
          description: The server's own error text; display verbatim.
    ErrorDetail:
      type: object
      additionalProperties: true
      required: [error, detail]
      description: 'Error with a specific reason — e.g. `{"error": "invalid transition", "detail": "..."}` or `{"error": "credential check failed", "detail": "...", "category": "..."}`. Extra numeric fields may carry the numbers behind a refusal (PRD §73/§74).'
      properties:
        error:
          type: string
        detail:
          type: string
        category:
          $ref: '#/components/schemas/ErrorCategory'
    ValidationError:
      type: object
      additionalProperties: true
      required: [error, errors]
      description: 'Field-named validation errors — `{"error": "validation", "errors": ["symbol: ...", ...]}`.'
      properties:
        error:
          type: string
          enum: [validation]
        errors:
          type: array
          items:
            type: string
    ConflictError:
      type: object
      additionalProperties: true
      required: [error, conflicts, preview]
      description: 'A conflicting plan is refused, never created (§117) — `{"error": "conflict", "conflicts": [...], "preview": {...}}`. Conflicts name real fields; show them verbatim.'
      properties:
        error:
          type: string
          enum: [conflict]
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/ConstraintConflict'
        preview:
          $ref: '#/components/schemas/PreviewResult'
    # ------------------------------------------------------------------
    # App-surface error shapes (real route bodies, not the normalized model;
    # that lives in packages/contracts/schemas/error-envelope.json).
    # ------------------------------------------------------------------
    FailError:
      type: object
      additionalProperties: true
      required: [error]
      description: 'The `fail()` helper body — `{"error": "<text>"}` with `detail` when the helper was given one. Display `error` verbatim.'
      properties:
        error:
          type: string
        detail:
          type: string
    SidecarError:
      type: object
      additionalProperties: true
      required: [error]
      description: |
        Any research-proxy or sidecar refusal: `{"error": "<real text>", ...}`.
        The extra keys are the failing branch's own evidence (mode, key, limit,
        upstream, upstreamStatus, detail, kind) and vary per branch; the fields
        below are the observed ones and others may appear.
      properties:
        error:
          type: string
        detail:
          type: string
        mode:
          type: string
        key:
          type: string
          nullable: true
        limit:
          type: string
        kind:
          type: string
          nullable: true
        upstream:
          type: string
        upstreamStatus:
          type: integer
          nullable: true
    # ------------------------------------------------------------------
    # Research read proxies — verbatim sidecar wire shapes
    # (services/data/internal/{cryptorank,khala,llama,chainrank,news}).
    # Every *float64 pointer emits JSON null when unknown (honest nulls,
    # never 0); every `omitempty` key is simply absent when unset.
    # ------------------------------------------------------------------
    CrEnvelope:
      type: object
      additionalProperties: false
      required: [kind, upstream, fetchedAt, cache, count]
      description: |
        The CryptoRank envelope: the five always-present keys plus the mode's
        own section(s) — only the relevant ones are emitted per mode.
        `fetchedAt` is unix seconds. Go bodies end in one trailing newline and
        use struct key order (field-compatible, not byte-identical).
      properties:
        kind:
          type: string
          description: Echo of the requested mode.
        upstream:
          type: string
          description: The upstream URL actually fetched.
        dataRoute:
          type: string
          nullable: true
          description: Which data route produced the payload (present on some modes).
        fetchedAt:
          type: integer
          format: int64
          description: Unix seconds.
        cache:
          type: string
          enum: [MISS, HIT]
        count:
          type: integer
          description: Number of rows/items in the mode's main section.
        upstreamTotal:
          type: number
          nullable: true
          description: Pre-slice upstream row count when the mode slices.
        slice:
          type: string
          nullable: true
          description: Human-readable slice semantics note (rendered verbatim by the board).
        changeSource:
          type: string
          nullable: true
          enum: [direct, derived-from-histPrices-24h, unavailable]
        anchor24h:
          $ref: '#/components/schemas/AnchorCount'
        anchor7d:
          $ref: '#/components/schemas/AnchorCount'
        global:
          $ref: '#/components/schemas/CrGlobal'
        fundingRounds:
          type: array
          items:
            $ref: '#/components/schemas/CrFundingRound'
        upcomingIco:
          type: array
          items:
            $ref: '#/components/schemas/CrUpcomingIco'
        category:
          $ref: '#/components/schemas/CrCategoryInfo'
        tagRows:
          type: array
          items:
            $ref: '#/components/schemas/CrTagRow'
        tag:
          $ref: '#/components/schemas/CrTagInfo'
        detail:
          $ref: '#/components/schemas/CrCoinDetail'
        chain:
          $ref: '#/components/schemas/CrChainInfo'
        chainRows:
          type: array
          items:
            $ref: '#/components/schemas/CrChainRow'
        listings:
          $ref: '#/components/schemas/CrListings'
        launchpoolRows:
          type: array
          items:
            $ref: '#/components/schemas/CrLaunchpoolRow'
        nodesaleRows:
          type: array
          items:
            $ref: '#/components/schemas/CrNodeSaleRow'
        ecosystemRows:
          type: array
          items:
            $ref: '#/components/schemas/CrEcosystemRow'
        ecosystem:
          $ref: '#/components/schemas/CrEcosystemInfo'
        rwaRows:
          type: array
          items:
            $ref: '#/components/schemas/CrRwaRow'
        rwaAsset:
          $ref: '#/components/schemas/CrRwaAsset'
        quarterlyBtc:
          type: array
          items:
            $ref: '#/components/schemas/CrQuarterlyYear'
        quarterlyEth:
          type: array
          items:
            $ref: '#/components/schemas/CrQuarterlyYear'
        prediction:
          $ref: '#/components/schemas/CrPredictionAgg'
        predictionRows:
          type: array
          items:
            $ref: '#/components/schemas/CrPredictionRow'
        newsRows:
          type: array
